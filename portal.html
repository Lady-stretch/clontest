<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>РЕСУРС | ВЫБОР ПУТИ</title>
    <link rel="icon" type="image/png" href="logo_header_final.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #080814; 
            --accent-gold: #C5A059; 
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
            --transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-deep); font-family: var(--font-main); position: relative;}

        h2, .serif { font-family: var(--font-serif); font-weight: 300; margin: 0; }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 5%;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            z-index: 2000; background: transparent;
        }
        
        .brand-name { 
            font-family: var(--font-serif); font-size: 18px; 
            letter-spacing: 12px; text-transform: uppercase; color: #fff; 
            text-align: center; margin-right: -12px;
        }

        .nav-trigger { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer;}
        .nav-trigger span { height: 1px; background: #fff; width: 20px; }

        /* --- SPLIT CONTAINER --- */
        .split-container { display: flex; width: 100%; height: 100dvh; position: relative; }
        @media (max-width: 768px) { .split-container { flex-direction: column; } }

        .side {
            position: relative;
            flex: 1;
            display: flex;
            align-items: flex-end; /* Текст прижимаем вниз */
            justify-content: center;
            transition: var(--transition);
            cursor: pointer;
            overflow: hidden;
        }
        
        @media (max-width: 768px) { .side { flex: none; height: 50dvh; } }

        /* Видео */
        .side video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.4;
            filter: contrast(1.1);
        }

        /* ГРАДИЕНТНАЯ ВУАЛЬ ДЛЯ ЧИТАЕМОСТИ */
        .side::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 5;
            transition: 0.5s;
        }
        /* Вуаль для Света (белая снизу) */
        .light-side::after {
            background: linear-gradient(to top, rgba(244, 244, 249, 0.9) 0%, rgba(244, 244, 249, 0) 60%);
        }
        /* Вуаль для Тьмы (черная снизу) */
        .dark-side::after {
            background: linear-gradient(to top, rgba(8, 8, 20, 0.9) 0%, rgba(8, 8, 20, 0) 60%);
        }

        /* Контентный блок */
        .side-content {
            position: relative;
            z-index: 10;
            padding: 60px 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-title {
            font-size: clamp(26px, 4vw, 38px);
            color: var(--accent-gold);
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .side-desc {
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Настройки текста Света */
        .light-side .side-desc { color: #000; font-weight: 500; }
        /* Настройки текста Тьмы */
        .dark-side .side-desc { color: #fff; }

        /* КНОПКА */
        .side-btn {
            padding: 18px 45px;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.4s;
        }
        
        .light-side .side-btn { background: #000; color: #fff; border: none; }
        .dark-side .side-btn { background: var(--accent-gold); color: #000; border: none; }

        /* ЦЕНТРАЛЬНАЯ МЕТКА */
        .center-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 500;
            pointer-events: none;
            text-align: center;
        }
        .center-text {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 11px;
            background: rgba(8, 8, 20, 0.9);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid var(--accent-gold);
            white-space: nowrap;
        }

        /* Адаптация под мобилки */
        @media (max-width: 768px) {
            .side-content { padding: 30px 20px; }
            .side-desc { font-size: 14px; margin-bottom: 20px; }
            .side-btn { width: 100%; max-width: 280px; }
            .center-text { font-size: 9px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-trigger"><span></span><span style="margin-top: 4px; width: 12px; align-self: flex-start;"></span></div>
    <div class="brand-name">РЕСУРС</div>
    <div style="width: 35px; height: 35px; background: url('logo_header_final.png') center/cover; border-radius: 6px;"></div>
</header>

<div class="center-label">
    <span class="center-text">В каком ты сегодня ресурсе?</span>
</div>

<div class="split-container">
    <div class="side light-side" onclick="selectSide('light')">
        <video autoplay muted loop playsinline preload="metadata">
            <source src="mfr-clip.mp4" type="video/mp4">
        </video>
        <div class="side-content">
            <h2 class="side-title serif">СВЕТ</h2>
            <p class="side-desc">Глубокое расслабление и восстановление. Снимите зажимы, избавьтесь от отеков и обретите легкость.</p>
            <button class="side-btn">Выбрать спокойствие</button>
        </div>
    </div>

    <div class="side dark-side" onclick="selectSide('dark')">
        <video autoplay muted loop playsinline preload="metadata">
            <source src="Упражнение Майкл Джексон Ls.mp4" type="video/mp4">
        </video>
        <div class="side-content">
            <h2 class="side-title serif">ТЬМА</h2>
            <p class="side-desc">Мощный заряд энергии и драйва. Работа над рельефом, жиросжигание и проявление силы тела.</p>
            <button class="side-btn">Выбрать драйв</button>
        </div>
    </div>
</div>

<script>
    function selectSide(side) {
        localStorage.setItem('resource_theme', side);
        document.body.style.opacity = '0';
        document.body.style.transition = '0.8s';
        setTimeout(() => {
            window.location.href = 'index.html'; 
        }, 800);
    }
</script>

</body>
</html>

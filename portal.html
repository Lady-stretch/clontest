<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РЕСУРС | ВЫБОР СОСТОЯНИЯ</title>
    <style>
        :root {
            --accent-gold: #C5A059;
            --font-main: 'Manrope', sans-serif;
            --transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        .split-container { display: flex; width: 100%; height: 100%; }

        .side {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            cursor: pointer;
            overflow: hidden;
        }

        /* Видео на фоне */
        .side video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.3;
            transition: var(--transition);
        }

        .side:hover { flex: 1.6; }
        .side:hover video { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }

        .side-content { position: relative; z-index: 10; text-align: center; color: #fff; padding: 20px; }

        .side-title {
            font-size: clamp(24px, 5vw, 48px);
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
        }

        .side-btn {
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        .light-side { border-right: 1px solid rgba(255,255,255,0.1); }
        .light-side:hover .side-btn { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }
        
        .dark-side:hover .side-btn { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); box-shadow: 0 0 30px var(--accent-gold); }

        .center-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }

        .center-text {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 12px;
            background: rgba(8, 8, 20, 0.8);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            .side:hover { flex: 1; }
            .side-title { font-size: 30px; letter-spacing: 6px; }
            .center-label { top: 50%; }
        }
    </style>
</head>
<body>

<div class="center-label">
    <span class="center-text">В каком ты сегодня ресурсе?</span>
</div>

<div class="split-container">
    <div class="side light-side" onclick="location.href='index.html?theme=light'">
        <video autoplay muted loop playsinline>
            <source src="mfr-clip.mp4" type="video/mp4">
        </video>
        <div class="side-content">
            <span class="side-title">СВЕТ</span>
            <button class="side-btn">Хочу легкости</button>
        </div>
    </div>

    <div class="side dark-side" onclick="location.href='index.html?theme=dark'">
        <video autoplay muted loop playsinline>
            <source src="Упражнение Майкл Джексон Ls.mp4" type="video/mp4">
        </video>
        <div class="side-content">
            <span class="side-title">ТЬМА</span>
            <button class="side-btn">Нужен драйв</button>
        </div>
    </div>
</div>

</body>
</html>

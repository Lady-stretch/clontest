    <meta charset="UTF-8">

    <title>РЕСУРС | Испытай удачу</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-gold: #C5A059;
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: var(--font-main); background: #000; color: #fff; overflow: hidden; }

        /* --- ИСПРАВЛЕННАЯ ШАПКА --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 15px 5%;
            display: grid; 
            /* Жестко задаем колонки: бока по 60px, центр забирает всё остальное */
            grid-template-columns: 60px 1fr 60px; 
            align-items: center;
            z-index: 2000;
            background: rgba(8, 8, 20, 0.25);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .back-link { display: flex; align-items: center; color: var(--accent-gold); text-decoration: none; }
        
        .brand-name { 
            font-family: var(--font-serif); 
            font-size: 22px; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            text-align: center; 
            /* Компенсируем отступ последней буквы для идеального центра */
            padding-left: 10px; 
        }

        .header-logo { display: flex; justify-content: flex-end; }
        .header-logo img { height: 38px; width: auto; border-radius: 8px; }

        /* --- ВИДЕОФОН --- */
        .video-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .video-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .video-overlay { position: absolute; inset: 0; background: radial-gradient(circle, rgba(8,8,20,0.2) 0%, rgba(8,8,20,0.85) 100%); }

        /* --- КОНТЕНТ --- */
        .main-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding-top: 60px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.25);
            padding: 40px 20px; border-radius: 35px; width: 92%; max-width: 440px;
            text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        h1 { font-family: var(--font-serif); font-size: clamp(24px, 6vw, 32px); color: var(--accent-gold); margin-bottom: 10px; letter-spacing: 2px; }
        .info-txt { font-size: 14px; opacity: 0.7; font-weight: 300; margin-bottom: 30px; line-height: 1.4; }

        /* --- WHEEL --- */
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--accent-gold); }
        .wheel-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid var(--accent-gold); z-index: 50;
        }

        .spin-button {
            margin-top: 35px; width: 100%; padding: 18px; background: var(--accent-gold);
            color: #000; border: none; border-radius: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .spin-button:disabled { opacity: 0.4; }

        /* --- MODAL --- */
        .win-modal {
            display: none; position: fixed; inset: 0; background: rgba(5,5,15,0.98);
            z-index: 5000; align-items: center; justify-content: center; padding: 20px;
        }
        .win-content {
            background: #0f0f1e; padding: 40px 25px; border-radius: 30px;
            border: 1px solid var(--accent-gold); text-align: center; max-width: 380px;
        }
        .win-name { font-size: 22px; font-weight: 600; color: #fff; margin: 15px 0; }
        .win-desc { font-size: 15px; opacity: 0.7; line-height: 1.6; margin-bottom: 30px; }
        .vk-btn {
            display: block; padding: 18px; background: #0077FF; color: #fff;
            text-decoration: none; border-radius: 12px; font-weight: 600; text-transform: uppercase;
        }

        @media (max-width: 400px) {
            .brand-name { font-size: 16px; letter-spacing: 6px; }
            .wheel-container { width: 240px; height: 240px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-link">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="brand-name">РЕСУРС</div>
    <div class="header-logo">
        <img src="logo_header_final.png" alt="Logo">
    </div>
</header>

<div class="video-wrapper">
    <video id="heroVideo" class="video-bg" autoplay muted loop playsinline preload="auto">
        <source src="hero-video.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
</div>

<div class="main-container">
    <div class="glass-panel">
        <h1>Твоя привилегия</h1>
        <p class="info-txt">Начни свою эволюцию с подарка. <br>Крути колесо и забирай бонус на тренировки!</p>
        
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>

        <button class="spin-button" onclick="startSpin()">Запустить удачу</button>
    </div>
</div>

<div class="win-modal" id="winModal">
    <div class="win-content">
        <h2 style="font-family: var(--font-serif); color: var(--accent-gold); font-size: 32px;">Поздравляем!</h2>
        <div id="winPrize" class="win-name"></div>
        <div id="winInfo" class="win-desc"></div>
        <a href="#" id="winLink" class="vk-btn">Забрать в ВК</a>
    </div>
</div>

<script>
    // Принудительный запуск видео при загрузке
    window.addEventListener('load', function() {
        const video = document.getElementById('heroVideo');
        video.play().catch(function(error) {
            console.log("Автозапуск заблокирован браузером, ждем клика");
        });
    });

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    const prizes = [
        { text: "70% РАЗОВОЕ", code: "SINGLE70", full: "Скидка 70% на разовое занятие", desc: "Попробуй атмосферу РЕСУРСА практически даром!" },
        { text: "20% АБОНЕМЕНТ", code: "ABON20", full: "Скидка 20% на любой абонемент", desc: "Выгода на пакеты 16, 32 или 64 занятия." },
        { text: "4 за 2000₽", code: "FOUR2000", full: "4 занятия за 2000 руб", desc: "Действует 14 дней. Погрузись в практику полностью." },
        { text: "40% ГОДОВОЙ", code: "YEAR40", full: "40% на годовой абонемент", desc: "Максимальная привилегия для твоей трансформации." },
        { text: "ТЕСТ-ДРАЙВ", code: "TD990", full: "Тест-драйв: 4 занятия / 990₽", desc: "Твой старт на неделю. 4 тренировки за копейки!" }
    ];

    let currentAngle = 0;
    const arc = Math.PI / (prizes.length / 2);

    function draw() {
        ctx.clearRect(0,0,600,600);
        prizes.forEach((p, i) => {
            const angle = currentAngle + i * arc;
            ctx.fillStyle = i % 2 === 0 ? "#0a0a14" : "#121225";
            ctx.beginPath(); ctx.moveTo(300, 300);
            ctx.arc(300, 300, 285, angle, angle + arc, false);
            ctx.fill(); ctx.strokeStyle = "#C5A059"; ctx.lineWidth = 2; ctx.stroke();
            
            ctx.save();
            ctx.fillStyle = "#C5A059";
            ctx.translate(300 + Math.cos(angle + arc/2) * 210, 300 + Math.sin(angle + arc/2) * 210);
            ctx.rotate(angle + arc/2 + Math.PI/2);
            ctx.font = 'bold 24px Manrope';
            ctx.fillText(p.text, -ctx.measureText(p.text).width/2, 0);
            ctx.restore();
        });
    }

    function startSpin() {
        // При клике на кнопку также пытаемся запустить видео, если оно не пошло
        document.getElementById('heroVideo').play();

        const btn = document.querySelector('.spin-button');
        btn.disabled = true;
        const totalRotation = Math.random() * 10 + 25;
        let rotationStep = 0;

        const anim = setInterval(() => {
            currentAngle += 0.15;
            rotationStep += 0.15;
            draw();
            if (rotationStep >= totalRotation) {
                clearInterval(anim);
                const index = Math.floor((((currentAngle + Math.PI/2) % (Math.PI * 2)) / (Math.PI * 2)) * prizes.length);
                const finalIdx = prizes.length - 1 - index;
                const win = prizes[finalIdx < 0 ? 0 : finalIdx];
                
                document.getElementById('winPrize').innerText = win.full;
                document.getElementById('winInfo').innerText = win.desc;
                document.getElementById('winLink').href = `https://vk.com/im?sel=-221142875&ref=wheel_${win.code}`;
                
                setTimeout(() => { document.getElementById('winModal').style.display = 'flex'; }, 600);
            }
        }, 15);
    }

    draw();
</script>
</body>
</html>

<html lang="ru">
<head>

            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>РЕСУРС | Испытай удачу</title>
    <link rel="icon" type="image/png" href="logo_header_final.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-gold: #C5A059;
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: var(--font-main); background: #000; color: #fff; overflow: hidden; }

        /* --- ШАПКА --- */
        header {
            position: fixed; top: 0; width: 100%; height: 70px;
            padding: 0 5%; display: flex; align-items: center; justify-content: space-between;
            z-index: 2000; background: rgba(8, 8, 20, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-link { width: 40px; color: var(--accent-gold); display: flex; align-items: center; text-decoration: none; z-index: 2100; }
        .brand-name { 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            font-family: var(--font-serif); font-size: clamp(18px, 4vw, 24px); 
            letter-spacing: 8px; text-transform: uppercase; white-space: nowrap; padding-left: 8px;
        }
        /* Секретная кнопка сброса на логотипе */
        .header-logo { width: 40px; display: flex; justify-content: flex-end; z-index: 2100; cursor: pointer; }
        .header-logo img { height: 35px; width: 35px; border-radius: 6px; pointer-events: none; }

        /* --- ВИДЕОФОН --- */
        .video-fixed-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .video-fixed-bg video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
        .video-fixed-overlay { position: absolute; inset: 0; background: rgba(8, 8, 20, 0.4); pointer-events: none; }

        /* --- КОНТЕНТ --- */
        .content-area {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            padding: 80px 15px 20px; position: relative; z-index: 10;
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(197, 160, 89, 0.3);
            padding: clamp(20px, 5vw, 40px); border-radius: 30px; width: 100%; max-width: 480px;
            text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        h1 { font-family: var(--font-serif); font-size: clamp(24px, 6vw, 32px); color: var(--accent-gold); margin-bottom: 8px; }
        .info-txt { font-size: 13px; opacity: 0.8; margin-bottom: 25px; line-height: 1.4; }

        /* --- WHEEL --- */
        .wheel-container { position: relative; width: clamp(260px, 75vw, 320px); height: clamp(260px, 75vw, 320px); margin: 0 auto; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--accent-gold); }
        .pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid var(--accent-gold); z-index: 100;
        }

        .spin-btn {
            margin-top: 30px; width: 100%; padding: 18px; background: var(--accent-gold);
            color: #000; border: none; border-radius: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .spin-btn:disabled { opacity: 0.4; cursor: default; }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(5,5,15,0.98);
            z-index: 5000; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(15px);
        }
        .modal-body {
            background: #0f0f1e; padding: 40px 25px; border-radius: 30px;
            border: 1px solid var(--accent-gold); text-align: center; max-width: 380px; width: 100%;
        }
        .instruction-box {
            background: rgba(197, 160, 89, 0.1); border: 1px dashed var(--accent-gold);
            padding: 15px; border-radius: 12px; margin: 20px 0;
        }
        .vk-link {
            display: block; padding: 18px; background: #0077FF; color: #fff;
            text-decoration: none; border-radius: 12px; font-weight: 600; text-transform: uppercase;
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0, 119, 255, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 119, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 119, 255, 0); } }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-link">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="brand-name">РЕСУРС</div>
    <div id="secretReset" class="header-logo" title="Сбросить память (админ)">
        <img src="logo_header_final.png" alt="Logo">
    </div>
</header>

<div class="video-fixed-bg">
    <video muted autoplay loop playsinline preload="auto" id="bgVideo">
        <source src="hero-video.mp4" type="video/mp4">
    </video>
    <div class="video-fixed-overlay"></div>
</div>

<div class="content-area">
    <div class="glass-box">
        <h1>Твоя привилегия</h1>
        <p id="mainText" class="info-txt">Раскрой потенциал своего тела. <br>Крути колесо и забирай подарок на старт!</p>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <button id="spinBtn" class="spin-btn" onclick="startSpin()">Запустить удачу</button>
    </div>
</div>

<div class="modal" id="winModal">
    <div class="modal-body">
        <h2 style="font-family: var(--font-serif); color: var(--accent-gold); font-size: 32px;">Поздравляем!</h2>
        <div id="prizeName" style="font-size: 22px; font-weight: 600; color: #fff; margin: 15px 0;"></div>
        <div id="prizeInfo" style="font-size: 14px; opacity: 0.8; line-height: 1.6;"></div>
        
        <div class="instruction-box">
            <p style="font-size: 13px; color: var(--accent-gold); text-transform: uppercase; font-weight: 600; margin-bottom: 5px;">Важный шаг:</p>
            <p style="font-size: 14px; color: #fff;">Нажми кнопку ниже и отправь Вере в чат сообщение: <br><strong>«Забрать выигрыш»</strong></p>
        </div>

        <a href="#" id="vkBtn" class="vk-link">ЗАБРАТЬ ВЫИГРЫШ</a>
    </div>
</div>

<script>
    const video = document.getElementById('bgVideo');
    function playBg() { video.play().catch(() => { document.addEventListener('click', () => video.play(), {once:true}); }); }
    playBg();

    // ПРОВЕРКА ПАМЯТИ (localStorage)
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('resurs_wheel_done')) {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.innerText = "ПОПЫТКА ИСПОЛЬЗОВАНА";
            document.getElementById('mainText').innerHTML = "Ваш бонус уже зафиксирован в системе.<br>Активируйте его в сообщениях группы ВК.";
        }
    });

    // СЕКРЕТНЫЙ СБРОС (Double Click на логотип)
    document.getElementById('secretReset').addEventListener('dblclick', () => {
        localStorage.removeItem('resurs_wheel_done');
        alert("Память сброшена. Николай Сергеевич, удачного тестирования!");
        location.reload();
    });

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    const prizes = [
        { text: "70% РАЗОВОЕ", code: "SINGLE70", full: "Скидка 70% на разовое занятие", desc: "Попробуй атмосферу РЕСУРСА за 390 руб! Идеально для первого знакомства." },
        { text: "20% АБОНЕМЕНТ", code: "ABON20", full: "Скидка 20% на любой абонемент", desc: "Твоя привилегия на любой пакет (16, 32 или 64 занятия)." },
        { text: "4 за 2000₽", code: "FOUR2000", full: "4 занятия за 2000 руб (14 дней)", desc: "Две недели полноценной практики. Погрузись в ритм студии." },
        { text: "40% ГОДОВОЙ", code: "YEAR40", full: "40% на годовой абонемент", desc: "Максимальный вклад в твою форму. Твой ресурс на целый год!" },
        { text: "ТЕСТ-ДРАЙВ", code: "TD990", full: "Тест-драйв: 3 занятия / 990₽ (7 дней)", desc: "Наш легендарный старт на одну неделю. Почувствуй эффект уже за 3 визита!" }
    ];

    let currentAngle = 0;
    const arc = Math.PI / (prizes.length / 2);

    function draw() {
        ctx.clearRect(0,0,600,600);
        prizes.forEach((p, i) => {
            const angle = currentAngle + i * arc;
            ctx.fillStyle = i % 2 === 0 ? "#0a0a14" : "#121225";
            ctx.beginPath(); ctx.moveTo(300, 300);
            ctx.arc(300, 300, 290, angle, angle + arc, false);
            ctx.fill(); ctx.strokeStyle = "rgba(197, 160, 89, 0.4)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.save();
            ctx.fillStyle = "#C5A059";
            ctx.translate(300 + Math.cos(angle + arc/2) * 215, 300 + Math.sin(angle + arc/2) * 215);
            ctx.rotate(angle + arc/2 + Math.PI/2);
            ctx.font = 'bold 24px Manrope';
            ctx.fillText(p.text, -ctx.measureText(p.text).width/2, 0);
            ctx.restore();
        });
    }

    function startSpin() {
        playBg();
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        const totalRotation = Math.random() * 10 + 35;
        let rotationStep = 0;
        const anim = setInterval(() => {
            currentAngle += 0.15;
            rotationStep += 0.15;
            draw();
            if (rotationStep >= totalRotation) {
                clearInterval(anim);
                
                // Фиксируем попытку в памяти
                localStorage.setItem('resurs_wheel_done', 'true');

                const index = Math.floor((((currentAngle + Math.PI/2) % (Math.PI * 2)) / (Math.PI * 2)) * prizes.length);
                const finalIdx = prizes.length - 1 - index;
                const win = prizes[finalIdx < 0 ? 0 : finalIdx];
                document.getElementById('prizeName').innerText = win.full;
                document.getElementById('prizeInfo').innerText = win.desc;
                document.getElementById('vkBtn').href = `https://vk.me/public221142875?ref=wheel_${win.code}`;
                setTimeout(() => { document.getElementById('winModal').style.display = 'flex'; }, 600);
            }
        }, 15);
    }
    draw();
</script>
</body>
</html>

<script>
    // Анимация чисел
    function animateValue(id, start, end, duration) {
        if (start === end) return;
        const obj = document.getElementById(id);
        const range = end - start;
        let current = start;
        const increment = end > start ? Math.ceil(range / (duration / 10)) : Math.floor(range / (duration / 10));
        const timer = setInterval(() => {
            current += increment;
            if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                current = end;
                clearInterval(timer);
            }
            obj.innerText = current.toLocaleString() + ' ₽';
        }, 10);
    }

    let lastFinal = 7124;

    function liveCalc() {
        const price = parseInt(document.getElementById('priceInput').value);
        document.getElementById('valPrice').innerText = price.toLocaleString() + ' ₽';

        // Логика расчета
        const tax = Math.round(price * 0.13);
        const cashbackPercent = price > 15000 ? 0.15 : 0.10; // PRO: Динамический кэшбэк
        const cash = Math.round(price * cashbackPercent);
        const bonus = 1500; // Ценность подарков
        const final = price - tax - cash - bonus;

        // Обновляем значения
        document.getElementById('valTax').innerText = tax.toLocaleString() + ' ₽';
        document.getElementById('valCash').innerText = cash.toLocaleString() + ' ₽';
        document.getElementById('valBonus').innerText = bonus.toLocaleString() + ' ₽';
        
        // Плавная анимация итога
        animateValue('valFinal', lastFinal, final, 200);
        lastFinal = final;

        // Метрика: Взаимодействие с калькулятором
        if (!window.calcTracked) {
            try { ym(108177329, 'reachGoal', 'CALC_INTERACT'); } catch(e){}
            window.calcTracked = true;
        }
    }

    function trackLead() {
        try { ym(108177329, 'reachGoal', 'CALC_LEAD_VK'); } catch(e){}
    }

    // Тема
    function toggleTheme() {
        const root = document.documentElement;
        const btn = document.getElementById('tglBtn');
        if (root.classList.contains('light-theme')) {
            root.classList.remove('light-theme');
            btn.innerText = 'СВЕТЛАЯ ТЕМА';
            localStorage.setItem('resurs_theme', 'dark');
        } else {
            root.classList.add('light-theme');
            btn.innerText = 'ТЕМНАЯ ТЕМА';
            localStorage.setItem('resurs_theme', 'light');
        }
    }

    if (localStorage.getItem('resurs_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
        document.getElementById('tglBtn').innerText = 'ТЕМНАЯ ТЕМА';
    }
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание | РЕСУРС</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://reservi.ru/widget-fit1c.v2/js/config.js" data-fit-salon-id="02977247-3381-4559-b9ef-1cf88d2731a2"></script>

    <style>
        :root {
            --bg-light: #FBFBFB;
            --text-dark: #1A1A1A;
            --accent: #C5A059;
        }

        body {
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Manrope', sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 20px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--accent); transform: translateX(-5px); }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 400;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 10px;
            margin-bottom: 50px;
        }

        /* Кастомизация контейнера виджета */
        .schedule-wrapper {
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            padding: 10px;
            min-height: 600px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="index.html" class="back-link">← На главную</a>
        <div class="logo-text">Ресурс</div>
        <div style="width: 80px;"></div> </header>

    <h1>Расписание занятий</h1>
    <p class="subtitle">Сыктывкар • Запись онлайн</p>

    <div class="schedule-wrapper">
        <div data-fit1c-calendar>
            <div style="padding: 100px; text-align: center; opacity: 0.5;">
                Загрузка актуального графика...
            </div>
        </div>
    </div>
</div>

</body>
</html>

        <button class="btn-gold" onclick="toVK()">Записаться в ВК</button>

<script>
    const ZODIACS = [
        { name: "Козерог", start: "01-01", end: "01-19", zone: "суставы и колени", dots: [[100,100], [150,120], [200,250], [250,200], [300,150]] },
        { name: "Водолей", start: "01-20", end: "02-18", zone: "голени и лимфу", dots: [[50,150], [150,100], [200,200], [300,150], [350,250]] },
        { name: "Рыбы", start: "02-19", end: "03-20", zone: "стопы и баланс", dots: [[100,200], [180,150], [250,250], [320,180]] },
        { name: "Овен", start: "03-21", end: "04-19", zone: "шею и голову", dots: [[100,100], [250,150], [300,250]] },
        { name: "Телец", start: "04-20", end: "05-20", zone: "плечи и горло", dots: [[100,150], [150,200], [250,180], [300,100], [320,250]] },
        { name: "Близнецы", start: "05-21", end: "06-20", zone: "руки и легкие", dots: [[100,100], [100,250], [250,100], [250,250], [175,175]] },
        { name: "Рак", start: "06-21", end: "07-22", zone: "грудь и дыхание", dots: [[200,100], [200,200], [150,300], [250,300]] },
        { name: "Лев", start: "07-23", end: "08-22", zone: "осанку и спину", dots: [[100,250], [200,250], [250,150], [200,100], [100,150]] },
        { name: "Дева", start: "08-23", end: "09-22", zone: "пресс и кор", dots: [[100,100], [150,150], [100,250], [200,200], [300,250]] },
        { name: "Весы", start: "09-23", end: "10-22", zone: "поясницу", dots: [[100,200], [200,100], [300,200], [200,300]] },
        { name: "Скорпион", start: "10-23", end: "11-21", zone: "таз и гибкость", dots: [[100,100], [150,150], [100,200], [200,250], [300,200], [350,250]] },
        { name: "Стрелец", start: "11-22", end: "12-21", zone: "бедра и ягодицы", dots: [[100,250], [200,150], [300,100], [250,200], [350,250]] },
        { name: "Козерог", start: "12-22", end: "12-31", zone: "колени и кости", dots: [[100,100], [150,120], [200,250], [250,200], [300,150]] }
    ];

    // Вычисление фазы Луны на сегодня
    function getMoonPhase() {
        let date = new Date();
        let year = date.getFullYear(); let month = date.getMonth() + 1; let day = date.getDate();
        if (month < 3) { year--; month += 12; }
        let a = Math.floor(year / 100); let b = Math.floor(a / 4); let c = 2 - a + b;
        let e = Math.floor(365.25 * (year + 4716)); let f = Math.floor(30.6001 * (month + 1));
        let jd = c + day + e + f - 1524.5;
        let daysSinceNew = jd - 2451549.5;
        let newMoons = daysSinceNew / 29.53;
        let phase = newMoons - Math.floor(newMoons);
        
        if (phase < 0.05 || phase > 0.95) return { n: "Новолуние", t: "закладываем намерения" };
        if (phase < 0.45) return { n: "Растущая Луна", t: "идеально для силовой растяжки" };
        if (phase < 0.55) return { n: "Полнолуние", t: "сбрасываем эмоции через тело" };
        return { n: "Убывающая Луна", t: "фокус на очищение и лимфодренаж" };
    }

    function hash(s) { let h = 0; for(let i=0; i<s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0; return Math.abs(h); }

    function save() {
        const n = document.getElementById('inName').value;
        const d = document.getElementById('inDob').value;
        if(!n || !d) return alert("Звезды ждут твои данные...");
        localStorage.setItem('resurs_astro_v3', JSON.stringify({n, d}));
        location.reload();
    }
    function reset() { localStorage.removeItem('resurs_astro_v3'); location.reload(); }

    function render() {
        const data = JSON.parse(localStorage.getItem('resurs_astro_v3'));
        if(!data) return;
        
        document.getElementById('formStep').style.display = 'none';
        document.getElementById('resultStep').style.display = 'block';

        const dob = new Date(data.d);
        const md = `${(dob.getMonth()+1).toString().padStart(2,'0')}-${dob.getDate().toString().padStart(2,'0')}`;
        const z = ZODIACS.find(i => md >= i.start && md <= i.end) || ZODIACS[0];
        
        const hKey = data.n + data.d + new Date().toISOString().slice(0,10);
        const hVal = hash(hKey);
        const energy = 40 + (hVal % 61);
        const moon = getMoonPhase();

        document.getElementById('outSign').innerText = z.name;
        document.getElementById('sign-name-bg').innerText = z.name;
        document.getElementById('outMoon').innerText = `🌒 ${moon.n}`;
        document.getElementById('outText').innerHTML = `Сегодня ${moon.n} — <b>${moon.t}</b>. Твоя астро-зона напряжения: <b>${z.zone}</b>. Рекомендуется практика для баланса стихии.`;
        document.getElementById('outEnergyNum').innerText = energy + "%";
        
        setTimeout(() => { document.getElementById('outBar').style.width = energy + "%"; }, 500);
        drawConstellation(z.dots);
    }

    function drawConstellation(dots) {
        const c = document.getElementById('constellation-canvas');
        if(!c) return;
        const ctx = c.getContext('2d');
        ctx.clearRect(0,0,350,350);
        ctx.strokeStyle = '#C5A059'; ctx.fillStyle = '#C5A059';
        ctx.lineWidth = 1; ctx.shadowBlur = 15; ctx.shadowColor = '#C5A059';

        ctx.beginPath();
        dots.forEach((d, i) => { if(i === 0) ctx.moveTo(d[0], d[1]); else ctx.lineTo(d[0], d[1]); });
        ctx.stroke();

        dots.forEach(d => { ctx.beginPath(); ctx.arc(d[0], d[1], 2.5, 0, Math.PI*2); ctx.fill(); });
    }

    function openVera(loc) {
        const overlay = document.getElementById('veraOverlay');
        const hVal = hash(loc + new Date().toISOString().slice(0,10));
        const msgs = loc === 'Советская' ? 
            ["Советская 3 сегодня в зените. Энергия Солнца даст тебе силы для новых рекордов.", "Звезды на Советской шепчут: пора вытянуть спину в самом сердце города."] :
            ["На Коммуне сегодня уют Венеры. Идеальное место для восстановления женской силы.", "Фазы Луны благоволят тихим студиям. Коммуна 77/2 даст тебе покой."];
        
        document.getElementById('veraMsg').innerText = msgs[hVal % msgs.length];
        overlay.classList.add('active');
    }

    function toVK() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        window.location.href = isMobile ? "vk://vk.com/write-221142875" : "https://vk.me/-221142875";
    }

    window.onload = render;
</script>

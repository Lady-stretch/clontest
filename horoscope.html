<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Астро-Ресурс | Твой личный прогноз</title>
    
    <link rel="icon" type="image/png" href="logo_header_final.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #05050A; 
            --accent-gold: #C5A059; 
            --text-main: #F4F4F9;
            --glass-bg: rgba(255, 255, 255, 0.02); 
            --glass-border: 1px solid rgba(197, 160, 89, 0.15); 
            --font-serif: 'Cormorant Garamond', serif;
            --font-main: 'Manrope', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.05) 0%, transparent 70%);
        }

        /* ШАПКА */
        header { 
            position: fixed; top: 0; width: 100%; padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 2000; background: rgba(5, 5, 10, 0.7); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: var(--glass-border);
        }
        .brand-name { font-family: var(--font-serif); font-size: 20px; letter-spacing: 10px; text-transform: uppercase; color: var(--accent-gold); }

        /* КОНТЕНТ */
        main { 
            padding: 120px 20px 60px; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh;
        }

        .layout { 
            display: flex; gap: 80px; align-items: center; max-width: 1200px; width: 100%;
            justify-content: center;
        }

        /* СОЗВЕЗДИЕ СЛЕВА (ТОЛЬКО ДЛЯ ПК) */
        #constellation-container {
            width: 400px; height: 400px; display: none; position: relative;
        }

        /* КАРТОЧКА */
        .card-zone { width: 100%; max-width: 420px; position: relative; }
        
        .magic-frame {
            width: 100%; aspect-ratio: 9 / 16;
            background: #080812; border: 1.5px solid var(--accent-gold);
            border-radius: 24px; padding: 45px 35px;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: 0.5s;
        }

        .zodiac-badge { color: var(--accent-gold); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px;}
        .story-title { font-family: var(--font-serif); font-size: 32px; color: #fff; line-height: 1.1; margin-bottom: 20px; }
        .story-text { font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.85); margin-bottom: 20px;}
        .story-text b { color: var(--accent-gold); }

        .energy-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); display: flex; justify-content: space-between; margin-bottom: 10px; }
        .energy-track { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; }
        .energy-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px var(--accent-gold); }

        .trainer-box { font-size: 13px; color: rgba(255,255,255,0.5); border-top: 1px solid rgba(197, 160, 89, 0.15); padding-top: 20px; }

        /* ВЫБОР СТУДИИ */
        .selection-panel { margin-top: 30px; text-align: center; width: 100%; }
        .studio-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .s-btn { 
            background: var(--glass-bg); border: var(--glass-border); padding: 16px; border-radius: 12px;
            color: #fff; cursor: pointer; transition: 0.3s; font-size: 14px; font-weight: 600;
        }
        .s-btn:hover { border-color: var(--accent-gold); background: rgba(197, 160, 89, 0.1); }

        /* ФОРМА ВВОДА */
        .form-overlay {
            position: fixed; inset: 0; background: var(--bg-deep); z-index: 3000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .form-card {
            background: #0F0F1A; border: 1px solid var(--accent-gold); padding: 40px;
            border-radius: 30px; max-width: 400px; width: 100%; text-align: center;
        }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(197, 160, 89, 0.3);
            color: #fff; padding: 18px; border-radius: 12px; margin-bottom: 15px; font-size: 16px;
        }
        .main-btn {
            background: var(--accent-gold); color: #000; padding: 18px; width: 100%;
            border-radius: 12px; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer;
        }

        /* МОДАЛКА ВЕРЫ */
        .vera-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .vera-overlay.active { display: flex; }

        @media (min-width: 1024px) {
            #constellation-container { display: block; }
        }

        @media (max-width: 600px) {
            .story-title { font-size: 26px; }
            .magic-frame { padding: 35px 25px; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-name">Ресурс</div>
    <img src="logo_header_final.png" style="height: 30px; border-radius: 5px;">
</header>

<main>
    <div class="layout">
        <div id="constellation-container">
            <canvas id="constellation-canvas" width="400" height="400"></canvas>
            <div id="sign-name-bg" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-serif); font-size: 120px; opacity: 0.03; color: var(--accent-gold); pointer-events: none; text-transform: uppercase;"></div>
        </div>

        <div class="card-zone">
            <div class="magic-frame" id="captureArea">
                <div>
                    <div class="zodiac-badge" id="outSign">Загрузка...</div>
                    <div class="story-title serif" id="outTitle">Твой поток <br>энергии</div>
                    <div class="story-text" id="outText"></div>
                </div>

                <div>
                    <div class="energy-label">
                        <span>Телесный ресурс</span>
                        <b id="outEnergyNum">0%</b>
                    </div>
                    <div class="energy-track"><div class="energy-fill" id="outBar"></div></div>
                    
                    <div class="trainer-box" id="outTrainer"></div>
                </div>
            </div>

            <div class="selection-panel">
                <p style="font-size: 11px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; margin-top: 20px;">📸 Скриншот для сторис</p>
                <div class="studio-btns">
                    <div class="s-btn" onclick="openVera('Советская')">Советская, 3</div>
                    <div class="s-btn" onclick="openVera('Коммуна')">Коммуна 77/2</div>
                </div>
                <p style="margin-top: 20px; font-size: 12px; opacity: 0.3; cursor: pointer;" onclick="reset()">Изменить дату рождения</p>
            </div>
        </div>
    </div>
</main>

<div class="form-overlay" id="formStep" style="display: none;">
    <div class="form-card">
        <h2 class="serif" style="color: var(--accent-gold); font-size: 30px; margin-bottom: 10px;">Астро-прогноз</h2>
        <p style="font-size: 14px; opacity: 0.5; margin-bottom: 25px;">Синхронизация биоритмов с ИИ Верой</p>
        <input type="text" id="inName" placeholder="Твое имя">
        <input type="date" id="inDob">
        <button class="main-btn" onclick="save()">Войти в поток</button>
    </div>
</div>

<div class="vera-overlay" id="veraOverlay">
    <div class="form-card">
        <h2 class="serif" id="veraTitle" style="color: var(--accent-gold);">Совет Веры</h2>
        <p id="veraMsg" style="margin: 20px 0; line-height: 1.6;"></p>
        <button class="main-btn" onclick="toVK()">Записаться в ВК</button>
    </div>
</div>

<script>
    const ZODIACS = [
        { name: "Козерог", start: "01-01", end: "01-19", zone: "суставы и колени", dots: [[100,100], [150,120], [200,250], [250,200], [300,150]] },
        { name: "Водолей", start: "01-20", end: "02-18", zone: "голени и лимфу", dots: [[50,150], [150,100], [200,200], [300,150], [350,250]] },
        { name: "Рыбы", start: "02-19", end: "03-20", zone: "стопы и баланс", dots: [[100,200], [180,150], [250,250], [320,180]] },
        { name: "Овен", start: "03-21", end: "04-19", zone: "шею и голову", dots: [[100,100], [250,150], [300,250]] },
        { name: "Телец", start: "04-20", end: "05-20", zone: "плечи и горло", dots: [[100,150], [150,200], [250,180], [300,100], [320,250]] },
        { name: "Близнецы", start: "05-21", end: "06-20", zone: "руки и легкие", dots: [[100,100], [100,250], [250,100], [250,250], [175,175]] },
        { name: "Рак", start: "06-21", end: "07-22", zone: "грудь и дыхание", dots: [[200,100], [200,200], [150,300], [250,300]] },
        { name: "Лев", start: "07-23", end: "08-22", zone: "осанку и спину", dots: [[100,250], [200,250], [250,150], [200,100], [100,150]] },
        { name: "Дева", start: "08-23", end: "09-22", zone: "пресс и кор", dots: [[100,100], [150,150], [100,250], [200,200], [300,250]] },
        { name: "Весы", start: "09-23", end: "10-22", zone: "поясницу", dots: [[100,200], [200,100], [300,200], [200,300]] },
        { name: "Скорпион", start: "10-23", end: "11-21", zone: "таз и гибкость", dots: [[100,100], [150,150], [100,200], [200,250], [300,200], [350,250]] },
        { name: "Стрелец", start: "11-22", end: "12-21", zone: "бедра и ягодицы", dots: [[100,250], [200,150], [300,100], [250,200], [350,250]] },
        { name: "Козерог", start: "12-22", end: "12-31", zone: "колени и кости", dots: [[100,100], [150,120], [200,250], [250,200], [300,150]] }
    ];

    function hash(s) { let h = 0; for(let i=0; i<s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0; return Math.abs(h); }

    function save() {
        const n = document.getElementById('inName').value;
        const d = document.getElementById('inDob').value;
        if(!n || !d) return alert("Звезды ждут твои данные...");
        localStorage.setItem('resurs_astro_v2', JSON.stringify({n, d}));
        location.reload();
    }

    function reset() { localStorage.removeItem('resurs_astro_v2'); location.reload(); }

    function render() {
        const data = JSON.parse(localStorage.getItem('resurs_astro_v2'));
        if(!data) return document.getElementById('formStep').style.display = 'flex';
        
        const dob = new Date(data.d);
        const md = `${(dob.getMonth()+1).toString().padStart(2,'0')}-${dob.getDate().toString().padStart(2,'0')}`;
        const z = ZODIACS.find(i => md >= i.start && md <= i.end) || ZODIACS[0];
        
        const hKey = data.n + data.d + new Date().toISOString().slice(0,10);
        const hVal = hash(hKey);
        const energy = 45 + (hVal % 51);

        document.getElementById('outSign').innerText = z.name;
        document.getElementById('sign-name-bg').innerText = z.name;
        document.getElementById('outText').innerHTML = `Сегодня твоя стихия требует внимания к <b>${z.zone}</b>. Вера рекомендует мягкую практику. Твой идеальный проводник: ${hVal % 2 ? 'Ольга' : 'Александра'}.`;
        document.getElementById('outEnergyNum').innerText = energy + "%";
        
        setTimeout(() => { document.getElementById('outBar').style.width = energy + "%"; }, 500);
        drawConstellation(z.dots);
    }

    function drawConstellation(dots) {
        const c = document.getElementById('constellation-canvas');
        const ctx = c.getContext('2d');
        ctx.clearRect(0,0,400,400);
        ctx.strokeStyle = '#C5A059';
        ctx.fillStyle = '#C5A059';
        ctx.lineWidth = 1;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#C5A059';

        ctx.beginPath();
        dots.forEach((d, i) => {
            if(i === 0) ctx.moveTo(d[0], d[1]);
            else ctx.lineTo(d[0], d[1]);
        });
        ctx.stroke();

        dots.forEach(d => {
            ctx.beginPath();
            ctx.arc(d[0], d[1], 3, 0, Math.PI*2);
            ctx.fill();
        });
    }

    function openVera(loc) {
        const overlay = document.getElementById('veraOverlay');
        const hVal = hash(loc + new Date().toISOString().slice(0,10));
        const msgs = loc === 'Советская' ? 
            ["Советская 3 сегодня в зените. Солнце даст тебе энергию для новых рекордов.", "Звезды на Советской шепчут: пора размять спину в центре города."] :
            ["На Коммуне сегодня Венера. Лучшее место для восстановления женской силы.", "Тишина Коммуны 77/2 сегодня лечит твою нервную систему."];
        
        document.getElementById('veraMsg').innerText = msgs[hVal % msgs.length];
        overlay.classList.add('active');
    }

    function toVK() { window.location.href = "vk://vk.com/write-221142875"; }

    render();
</script>

</body>
</html>

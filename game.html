<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>РЕСУРС • 3D-Раннер Эволюция</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Подключение легкого 3D движка Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-deep: #060C07;
            --surface-color: #111A13;
            --accent-emerald: #10B981;
            --accent-gold: #C5A059;
            --text-main: #F4F4F9;
            --text-dim: #A3B2A7;
            --danger: #EF4444;
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg-deep); color: var(--text-main);
            font-family: var(--font-main); user-select: none;
        }

        /* ИГРОВОЙ ИНТЕРФЕЙС ПОВЕРХ 3D ХОЛСТА */
        #game-ui {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 16px 20px;
            pointer-events: none;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto;
        }

        .btn-back {
            background: rgba(17, 26, 19, 0.85); border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-gold); padding: 8px 14px; border-radius: 10px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; text-decoration: none; backdrop-filter: blur(10px);
        }

        .coin-counter {
            background: rgba(17, 26, 19, 0.85); border: 1px solid var(--accent-gold);
            padding: 8px 16px; border-radius: 20px; color: var(--accent-gold);
            font-family: var(--font-serif); font-size: 20px; font-weight: 700;
            display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(197, 160, 89, 0.2);
        }

        .tap-instruction {
            text-align: center; color: var(--text-dim); font-size: 12px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* ЭКРАН GAME OVER / СТАРТА */
        .overlay-modal {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(6, 12, 7, 0.92); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; pointer-events: auto;
        }

        .modal-card {
            background: var(--surface-color); border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px; padding: 28px 20px; max-width: 360px; width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-card h2 { font-family: var(--font-serif); font-size: 32px; color: var(--accent-gold); margin-bottom: 8px; }
        .modal-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 20px; }

        .btn-start {
            display: inline-flex; align-items: center; justify-content: center; width: 100%;
            padding: 14px; background: var(--accent-emerald); border: none;
            color: #FFF; font-size: 12px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .btn-start:hover { background: #059669; }

        #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="game-ui">
    <div class="top-bar">
        <a href="evolution.html" class="btn-back">← Дневник</a>
        <div class="coin-counter">🪙 <span id="coin-val">0</span></div>
    </div>
    <div class="tap-instruction" id="tap-hint">Нажмите на экран для прыжка</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО СТАРТА / ПЕРЕЗАПУСКА -->
<div class="overlay-modal" id="modal-overlay">
    <div class="modal-card">
        <h2 id="modal-title">Путь к Эволюции</h2>
        <p id="modal-desc">Собирайте золотые коины, уворачивайтесь от фастфуда и прокачивайте свой крипто-кошелек здоровья!</p>
        <button class="btn-start" onclick="startGame()">Начать забег</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let player, floor;
    let obstacles = [], coins = [];
    let isPlaying = false, isJumping = false;
    let jumpVelocity = 0;
    const gravity = -0.015;
    
    let scoreCoins = 0;
    let totalCoins = parseInt(localStorage.getItem('resurs_coins')) || 0;
    let gameSpeed = 0.35;
    let spawnTimer = 0;

    document.getElementById('coin-val').innerText = totalCoins;

    function init3D() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060C07);
        scene.fog = new THREE.FogExp2(0x060C07, 0.025);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 7);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // ОСВЕЩЕНИЕ
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xC5A059, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ДОРОЖКА (ИЗУМРУДНАЯ)
        const floorGeo = new THREE.PlaneGeometry(6, 200);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x111A13, side: THREE.DoubleSide });
        floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = Math.PI / 2;
        floor.position.z = -90;
        scene.add(floor);

        // БОКОВЫЕ ЛИНИИ ДОРОЖКИ
        const lineGeo = new THREE.PlaneGeometry(0.1, 200);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x10B981 });
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = Math.PI / 2; leftLine.position.set(-3, 0.01, -90);
        scene.add(leftLine);

        const rightLine = new THREE.Mesh(lineGeo, lineMat);
        rightLine.rotation.x = Math.PI / 2; rightLine.position.set(3, 0.01, -90);
        scene.add(rightLine);

        // СОЗДАНИЕ ИГРОКА (3D СИЛУЭТ)
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(0.6, 0.9, 0.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x10B981, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.45;
        playerGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xC5A059 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.15;
        playerGroup.add(head);

        player = playerGroup;
        player.position.set(0, 0, 2);
        scene.add(player);

        window.addEventListener('resize', onWindowResize);
        
        // УПРАВЛЕНИЕ ТАПАМИ И КЛИКАМИ
        window.addEventListener('touchstart', handleTap, { passive: false });
        window.addEventListener('mousedown', handleTap);
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleTap(); });

        animate();
    }

    function handleTap(e) {
        if (e && e.target && e.target.closest('#game-ui .top-bar')) return;
        if (!isPlaying) return;
        
        if (!isJumping) {
            isJumping = true;
            jumpVelocity = 0.26;
        }
    }

    function spawnEntity() {
        spawnTimer++;
        if (spawnTimer > 45) {
            spawnTimer = 0;
            const isObstacle = Math.random() > 0.4;

            if (isObstacle) {
                // ПРЕПЯТСТВИЕ (КРАСНЫЙ ФАСТФУД КУБ)
                const obsGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xEF4444, roughness: 0.5 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(0, 0.4, -40);
                scene.add(obs);
                obstacles.push(obs);
            } else {
                // БОНУС (ЗОЛОТАЯ МОНЕТА RESURSCOIN)
                const coinGeo = new THREE.OctahedronGeometry(0.35, 0);
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xC5A059, metalness: 0.8, roughness: 0.2 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(0, 0.6, -40);
                scene.add(coin);
                coins.push(coin);
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        if (isPlaying) {
            // ФИЗИКА ПРЫЖКА
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity += gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            spawnEntity();

            // ДВИЖЕНИЕ ПРЕПЯТСТВИЙ И СТОЛКНОВЕНИЯ
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += gameSpeed;

                // Проверка столкновения
                if (Math.abs(obs.position.z - player.position.z) < 0.6 && player.position.y < 0.6) {
                    gameOver();
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // ДВИЖЕНИЕ МОНЕТ И СБОР
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.position.z += gameSpeed;
                c.rotation.y += 0.05;

                // Сбор монеты
                if (Math.abs(c.position.z - player.position.z) < 0.7 && Math.abs(player.position.y - c.position.y) < 0.8) {
                    scoreCoins += 10;
                    totalCoins += 10;
                    document.getElementById('coin-val').innerText = totalCoins;
                    localStorage.setItem('resurs_coins', totalCoins);
                    
                    scene.remove(c);
                    coins.splice(i, 1);
                } else if (c.position.z > 5) {
                    scene.remove(c);
                    coins.splice(i, 1);
                }
            }
        }

        renderer.render(scene, camera);
    }

    function startGame() {
        // Очистка старых объектов
        obstacles.forEach(o => scene.remove(o));
        coins.forEach(c => scene.remove(c));
        obstacles = []; coins = [];
        
        scoreCoins = 0;
        player.position.set(0, 0, 2);
        isJumping = false;
        
        document.getElementById('modal-overlay').style.display = 'none';
        isPlaying = true;
    }

    function gameOver() {
        isPlaying = false;
        document.getElementById('modal-title').innerText = "Забег окончен!";
        document.getElementById('modal-desc').innerText = `Вы заработали +${scoreCoins} ResursCoins в этом забеге. Общий баланс обновлен!`;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init3D;
</script>
</body>
</html>

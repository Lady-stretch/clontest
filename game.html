<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>РЕСУРС • Премиум Эволюция Движения</title>
    
    <link rel="icon" type="image/png" href="https://resurs-stretch.ru/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #060C07;
            --surface-color: #0B1F16;
            --accent-emerald: #10B981;
            --accent-gold: #D4AF37;
            --text-main: #F4F4F9;
            --text-dim: #A3B2A7;
            --danger: #FF3366;
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg-deep); color: var(--text-main);
            font-family: var(--font-main); user-select: none;
        }

        #game-ui {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 16px 20px;
            pointer-events: none;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto;
        }

        .btn-back {
            background: rgba(11, 31, 22, 0.95); border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--accent-gold); padding: 8px 14px; border-radius: 10px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; text-decoration: none; backdrop-filter: blur(10px);
        }

        .brand-watermark {
            font-family: var(--font-serif); font-size: 14px; letter-spacing: 3px;
            color: var(--accent-gold); text-transform: uppercase; font-weight: 700;
            text-align: center; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .hud-stats { display: flex; gap: 10px; align-items: center; }

        .lives-container {
            background: rgba(11, 31, 22, 0.95); border: 1px solid rgba(255, 51, 102, 0.5);
            padding: 8px 12px; border-radius: 20px; color: var(--danger);
            font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 4px;
            backdrop-filter: blur(10px);
        }

        .coin-counter {
            background: rgba(11, 31, 22, 0.95); border: 1px solid var(--accent-gold);
            padding: 8px 14px; border-radius: 20px; color: var(--accent-gold);
            font-family: var(--font-serif); font-size: 18px; font-weight: 700;
            display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px);
            cursor: pointer;
        }

        /* Прогресс цели 1000м */
        .goal-progress-box {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 400px;
            background: rgba(11, 31, 22, 0.85); border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px; padding: 6px 12px; pointer-events: auto; backdrop-filter: blur(8px);
        }
        .goal-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-gold); text-align: center; margin-bottom: 4px; font-weight: 800; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--accent-emerald); width: 0%; transition: 0.2s; }

        .tap-instruction {
            text-align: center; color: var(--accent-emerald); font-size: 13px;
            text-transform: uppercase; letter-spacing: 3px; font-weight: 800;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

        .overlay-modal {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(6, 12, 7, 0.94); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; pointer-events: auto;
        }

        .modal-card {
            background: var(--surface-color); border: 1px solid var(--accent-gold);
            border-radius: 22px; padding: 32px 24px; max-width: 400px; width: 100%;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }

        .modal-card h2 { font-family: var(--font-serif); font-size: 30px; color: var(--accent-gold); margin-bottom: 8px; }
        .modal-card p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px; }

        .btn-start {
            display: inline-flex; align-items: center; justify-content: center; width: 100%;
            padding: 15px; background: var(--accent-emerald); border: none;
            color: #FFF; font-size: 13px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .btn-start:disabled { background: #1B2E24; color: #4B6357; cursor: not-allowed; }

        .promo-box { background: #030604; border: 1px dashed var(--accent-gold); padding: 12px; font-size: 18px; font-weight: 800; color: var(--accent-gold); border-radius: 10px; margin-bottom: 16px; }

        canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="game-ui">
    <div class="top-bar">
        <a href="evolution.html" class="btn-back">← Дневник</a>
        <div class="brand-watermark">RESURS</div>
        <div class="hud-stats">
            <div class="lives-container" id="lives-display">❤️❤️❤️❤️❤️</div>
            <!-- СЕКРЕТНЫЙ СБРОС: ТРИПЛ-КЛИК ПО МОНЕТАМ -->
            <div class="coin-counter" id="secret-reset-btn" onclick="handleSecretClick()">🪙 <span id="coin-val">0</span></div>
        </div>
    </div>

    <div class="goal-progress-box">
        <div class="goal-title">Цель: 1000 метров к Награде (<span id="dist-val">0</span>м)</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="goal-bar-fill"></div>
        </div>
    </div>

    <div class="tap-instruction">⚡ Тап по экрану — Прыжок</div>
</div>

<div class="overlay-modal" id="modal-overlay">
    <div class="modal-card">
        <h2 id="modal-title">ЭВОЛЮЦИЯ РЕСУРСА</h2>
        <p id="modal-desc">Пробегите 1000 метров до студии на Коммунистической 67! Собирайте воду 💧 и коврики 🧘. Избегайте фастфуда 🍔.</p>
        <div id="promo-container" style="display: none;">
            <div class="promo-box">RESURS-RUN-600</div>
        </div>
        <button class="btn-start" id="start-btn" onclick="startGame()">Начать забег (5 жизней)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let scoreCoins = 0;
    
    let todayStr = new Date().toDateString();
    let savedData = JSON.parse(localStorage.getItem('resurs_game_data'));
    
    if (!savedData || savedData.date !== todayStr) {
        savedData = { date: todayStr, lives: 5, coins: parseInt(localStorage.getItem('resurs_coins')) || 0 };
        localStorage.setItem('resurs_game_data', JSON.stringify(savedData));
    }

    let totalCoins = savedData.coins;
    let currentLives = savedData.lives;
    document.getElementById('coin-val').innerText = totalCoins;
    updateLivesUI();

    let gameSpeed = 5.5;
    let frameCount = 0;
    let distance = 0;
    const GOAL_DISTANCE = 1000;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const player = {
        x: 80, y: 0, width: 48, height: 74,
        velocityY: 0, gravity: 0.75, jumpPower: -15,
        isGrounded: false, legAngle: 0, shieldTimer: 0
    };

    let groundY = canvas.height - 120;
    let obstacles = [];
    let items = [];
    let particles = [];

    // СЕКРЕТНЫЙ СБРОС ЛИМИТА ЖИЗНЕЙ (3 БЫСТРЫХ КЛИКА)
    let secretClicks = 0;
    let secretTimer = null;
    function handleSecretClick() {
        secretClicks++;
        clearTimeout(secretTimer);
        secretTimer = setTimeout(() => { secretClicks = 0; }, 1000);

        if (secretClicks >= 3) {
            secretClicks = 0;
            currentLives = 5;
            savedData.lives = 5;
            savedData.date = todayStr;
            localStorage.setItem('resurs_game_data', JSON.stringify(savedData));
            updateLivesUI();
            alert('🧪 [ТЕСТОВЫЙ РЕЖИМ] Лимит жизней успешно сброшен до 5!');
        }
    }

    function updateLivesUI() {
        let hearts = '❤️'.repeat(Math.max(0, currentLives)) + '🖤'.repeat(Math.max(0, 5 - currentLives));
        document.getElementById('lives-display').innerText = hearts;
        
        const btn = document.getElementById('start-btn');
        if (currentLives <= 0) {
            btn.innerText = 'Попытки на сегодня исчерпаны';
            btn.disabled = true;
        } else {
            btn.innerText = `Начать забег (Осталось жизней: ${currentLives}/5)`;
            btn.disabled = false;
        }
    }

    function handleJump(e) {
        if (e && e.target && e.target.closest('#game-ui .top-bar')) return;
        if (!isPlaying) return;
        if (player.isGrounded) {
            player.velocityY = player.jumpPower;
            player.isGrounded = false;
            createParticles(player.x + 20, groundY, '#10B981', 6);
        }
    }

    window.addEventListener('touchstart', handleJump, { passive: false });
    window.addEventListener('mousedown', handleJump);
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); handleJump(); } });

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 2,
                size: Math.random() * 4 + 2, color, alpha: 1
            });
        }
    }

    function spawnObjects() {
        frameCount++;
        groundY = canvas.height - 120;

        if (frameCount % Math.max(40, Math.floor(90 - gameSpeed * 3)) === 0) {
            let rand = Math.random();
            if (rand < 0.45) {
                obstacles.push({ x: canvas.width + 40, y: groundY - 42, width: 42, height: 42, type: 'burger' });
            } else if (rand < 0.8) {
                items.push({ x: canvas.width + 40, y: groundY - (Math.random() > 0.4 ? 50 : 120), width: 32, height: 32, type: 'coin' });
            } else if (rand < 0.92) {
                items.push({ x: canvas.width + 40, y: groundY - 55, width: 36, height: 36, type: 'water' });
            } else {
                items.push({ x: canvas.width + 40, y: groundY - 60, width: 40, height: 40, type: 'mat' });
            }
        }
    }

    function update() {
        if (!isPlaying) return;

        distance += Math.round(gameSpeed * 0.1);
        document.getElementById('dist-val').innerText = distance;
        document.getElementById('goal-bar-fill').style.width = Math.min(100, (distance / GOAL_DISTANCE) * 100) + '%';

        // Проверка победы (1000м)
        if (distance >= GOAL_DISTANCE) {
            gameWin();
            return;
        }

        player.velocityY += player.gravity;
        player.y += player.velocityY;

        if (player.y >= groundY - player.height) {
            player.y = groundY - player.height;
            player.velocityY = 0;
            player.isGrounded = true;
        }

        player.legAngle += 0.22;
        if (player.shieldTimer > 0) player.shieldTimer--;

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        // Препятствия
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            if (player.x < obs.x + obs.width - 10 && player.x + player.width - 10 > obs.x &&
                player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                if (player.shieldTimer > 0) {
                    createParticles(obs.x + 20, obs.y + 20, '#D4AF37', 12);
                    obstacles.splice(i, 1);
                } else {
                    currentLives--;
                    createParticles(player.x + 24, player.y + 35, '#FF3366', 15);
                    obstacles.splice(i, 1);
                    updateLivesUI();
                    
                    savedData.lives = currentLives;
                    localStorage.setItem('resurs_game_data', JSON.stringify(savedData));

                    if (currentLives <= 0) {
                        gameOver(true);
                        return;
                    }
                }
            }
            if (obs.x < -60) obstacles.splice(i, 1);
        }

        // Бонусы
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.x -= gameSpeed;

            if (player.x < item.x + item.width && player.x + player.width > item.x &&
                player.y < item.y + item.height && player.y + player.height > item.y) {
                if (item.type === 'coin') { scoreCoins += 20; totalCoins += 20; }
                else if (item.type === 'water') { scoreCoins += 80; totalCoins += 80; }
                else if (item.type === 'mat') { scoreCoins += 150; totalCoins += 150; player.shieldTimer = 400; }

                document.getElementById('coin-val').innerText = totalCoins;
                savedData.coins = totalCoins;
                localStorage.setItem('resurs_game_data', JSON.stringify(savedData));
                localStorage.setItem('resurs_coins', totalCoins);

                items.splice(i, 1);
            } else if (item.x < -60) {
                items.splice(i, 1);
            }
        }

        spawnObjects();
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Премиальный фон
        let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#060C07');
        bgGrad.addColorStop(0.5, '#0B1F16');
        bgGrad.addColorStop(1, '#060C07');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Неоновая линия пола
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        // Частицы
        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Персонаж
        ctx.save();
        ctx.translate(player.x, player.y);

        if (player.shieldTimer > 0) {
            ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(player.width/2, player.height/2, 48, 0, Math.PI * 2); ctx.stroke();
        }

        ctx.fillStyle = '#D4AF37';
        ctx.beginPath(); ctx.arc(player.width / 2, 14, 12, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#10B981';
        ctx.beginPath(); ctx.roundRect(6, 26, player.width - 12, 30, 8); ctx.fill();

        ctx.strokeStyle = '#F4F4F9'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        let legOffset = Math.sin(player.legAngle) * 16;

        if (player.isGrounded) {
            ctx.beginPath(); ctx.moveTo(14, 56); ctx.lineTo(14 - legOffset, 74); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(player.width - 14, 56); ctx.lineTo(player.width - 14 + legOffset, 74); ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(14, 56); ctx.lineTo(8, 66); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(player.width - 14, 56); ctx.lineTo(player.width - 6, 70); ctx.stroke();
        }
        ctx.restore();

        // Препятствия и бонусы
        obstacles.forEach(obs => {
            ctx.font = '32px Manrope'; ctx.textAlign = 'center';
            ctx.fillText('🍔', obs.x + obs.width/2, obs.y + 32);
        });

        items.forEach(item => {
            ctx.font = '30px Manrope'; ctx.textAlign = 'center';
            let icon = item.type === 'coin' ? '🪙' : item.type === 'water' ? '💧' : '🧘';
            ctx.fillText(icon, item.x + item.width/2, item.y + 28);
        });
    }

    function startGame() {
        if (currentLives <= 0) return;

        obstacles = []; items = []; particles = [];
        scoreCoins = 0; distance = 0; gameSpeed = 5.5;
        player.y = groundY - player.height; player.velocityY = 0; player.shieldTimer = 0;

        document.getElementById('promo-container').style.display = 'none';
        document.getElementById('modal-overlay').style.display = 'none';
        isPlaying = true;
        update();
    }

    function gameWin() {
        isPlaying = false;
        document.getElementById('modal-title').innerText = "ПОБЕДА! 1000 МЕТРОВ";
        document.getElementById('modal-desc').innerText = `Вы прошли дистанцию до студии! Заберите ваш промокод на скидку 600 ₽:`;
        document.getElementById('promo-container').style.display = 'block';
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function gameOver(isOutOfLives) {
        isPlaying = false;
        document.getElementById('modal-title').innerText = isOutOfLives ? "ДЕНЬ ЗАВЕРШЕН" : "ВНИМАНИЕ!";
        document.getElementById('modal-desc').innerText = isOutOfLives 
            ? `Жизни на сегодня исчерпаны (0/5). Ждем вас на тренировке в студии на Коммунистической 67!`
            : `Столкновение с фастфудом! Осталось попыток: ${currentLives}/5.`;
        updateLivesUI();
        document.getElementById('modal-overlay').style.display = 'flex';
    }
</script>
</body>
</html>

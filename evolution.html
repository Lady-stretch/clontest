<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>РЕСУРС | Эволюция тела</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&family=Big+Shoulders+Display:wght@100;400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --accent: #C5A059;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --safe: #4ade80;
            --fire: #ff4500;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; padding: 20px; min-height: 100vh; }
        
        /* Зернистость фона */
        body::before {
            content: ""; position: fixed; inset: 0; 
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.02; pointer-events: none; z-index: -1;
        }

        .container { max-width: 800px; margin: 0 auto; }

        header { text-align: center; margin: 40px 0; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: 2px; color: var(--accent); }
        header p { font-size: 0.7rem; letter-spacing: 5px; opacity: 0.5; text-transform: uppercase; margin-top: 10px; }

        .card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 28px; padding: 30px; margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Главный счетчик */
        .main-counter { text-align: center; margin-bottom: 30px; position: relative; }
        .main-counter::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%); z-index: -1; border-radius: 50%;
        }
        .days-number { font-family: 'Big Shoulders Display', sans-serif; font-size: 6rem; font-weight: 900; line-height: 1; color: #fff; display: block; text-shadow: 0 0 20px rgba(197, 160, 89, 0.4); }
        .days-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 4px; color: var(--accent); font-weight: 700; }

        /* Сетка мощных метрик */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .stat-item { background: rgba(0,0,0,0.3); padding: 20px 15px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center; transition: 0.3s; }
        .stat-item:hover { border-color: var(--accent); transform: translateY(-3px); background: rgba(197, 160, 89, 0.05); }
        .stat-item b { font-size: 1.4rem; display: block; color: #fff; margin-bottom: 5px; font-weight: 800; }
        .stat-item span { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; display: block; }
        
        .accent-text { color: var(--accent) !important; }
        .fire-text { color: var(--fire) !important; text-shadow: 0 0 10px rgba(255, 69, 0, 0.4); }

        /* Прогресс-бар */
        .next-goal { margin-top: 30px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .bar-bg { height: 8px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-top: 12px; overflow: hidden; border: 1px solid var(--glass-border); }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #8a6e3c, var(--accent)); width: 0%; transition: width 1.5s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 0 10px var(--accent); }

        /* Таймлайн регенерации */
        .regen-list { margin-top: 30px; }
        .regen-item {
            display: flex; gap: 20px; margin-bottom: 25px; position: relative; opacity: 0.2; transition: all 0.8s ease; filter: grayscale(100%);
        }
        .regen-item::before {
            content: ''; position: absolute; left: 22px; top: 45px; width: 2px; height: calc(100% - 20px);
            background: var(--glass-border); z-index: -1;
        }
        .regen-item:last-child::before { display: none; }
        
        .regen-item.active { opacity: 1; filter: grayscale(0%); transform: translateX(5px); }
        .regen-item.active::before { background: linear-gradient(to bottom, var(--accent), transparent); }
        
        .regen-icon {
            width: 46px; height: 46px; background: #0a0a0c; border: 2px solid var(--glass-border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 1.2rem; transition: 0.5s;
        }
        .regen-item.active .regen-icon { border-color: var(--accent); box-shadow: 0 0 20px rgba(197, 160, 89, 0.3); background: rgba(197, 160, 89, 0.1); }
        
        .regen-info h4 { font-size: 1rem; margin-bottom: 6px; color: #fff; letter-spacing: 0.5px; }
        .regen-info p { font-size: 0.8rem; color: #aaa; line-height: 1.5; }
        .regen-day { display: inline-block; font-size: 0.6rem; background: var(--glass); padding: 3px 8px; border-radius: 10px; color: var(--accent); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--glass-border); }

        .btn-action {
            width: 100%; padding: 22px; border-radius: 20px; border: 1px solid var(--accent);
            background: rgba(197, 160, 89, 0.1); color: var(--accent); font-weight: 800; text-transform: uppercase;
            letter-spacing: 3px; cursor: pointer; margin-top: 10px; margin-bottom: 40px; transition: 0.3s;
        }
        .btn-action:hover { background: var(--accent); color: #000; box-shadow: 0 10px 30px rgba(197, 160, 89, 0.4); transform: translateY(-2px); }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ЭВОЛЮЦИЯ</h1>
            <p>Код твоего обновления</p>
        </header>

        <div class="card">
            <div class="main-counter">
                <span class="days-number" id="days-val">0</span>
                <span class="days-label">дней в ресурсе</span>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><b id="workout-count">0</b><span>Тренировок</span></div>
                <div class="stat-item"><b id="stress-save" class="accent-text">0%</b><span>Стресса снято</span></div>
                <div class="stat-item"><b id="doc-save">0 ч.</b><span>Сэкономлено на врачах</span></div>
                <div class="stat-item"><b id="libido-level">База</b><span>Уровень либидо</span></div>
            </div>

            <div class="next-goal">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span style="opacity: 0.6;">Прогресс до статуса <span id="next-goal-name" style="color: #fff;">Адепт</span></span>
                    <span id="next-goal-text" style="color: var(--accent);">Еще 8 занятий</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" id="goal-progress"></div></div>
            </div>
        </div>

        <div class="card">
            <h3 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 25px; text-align: center; color: var(--accent);">Таймлайн трансформации</h3>
            <div class="regen-list" id="regen-container">
                </div>
        </div>

        <button class="btn-action" onclick="window.history.back()">Вернуться к диагностике</button>
    </div>

    <script>
        // Данные о регенерации тела
        const milestones = [
            { id: 1, day: 1, icon: "🧘‍♀️", title: "Нервная система", desc: "Уровень кортизола снизился. Глубокая фаза сна сегодня будет на 20% дольше. Мозг начинает перезагрузку." },
            { id: 2, day: 3, icon: "🩸", title: "Кровообращение", desc: "Микроциркуляция в мягких тканях и малом тазу улучшилась. Уходят утренние отеки, клетки получают больше кислорода." },
            { id: 3, day: 7, icon: "🦴", title: "Эластичность фасций", desc: "Фасции стали более напитанными влагой. Утренняя скованность в пояснице и шее исчезла на 40%." },
            { id: 4, day: 14, icon: "🔥", title: "Гормональный всплеск", desc: "Улучшение кровотока запускает выработку эндорфинов и повышает чувственность. Тело становится более отзывчивым." },
            { id: 5, day: 30, icon: "🦋", title: "Полная метаморфоза", desc: "Мышечный корсет надежно удерживает позвоночник. Осанка стала грациозной привычкой. Формируются новые нейронные связи." }
        ];

        const levels = [
            { n: 0, name: "Новичок" },
            { n: 8, name: "Адепт" },
            { n: 24, name: "Трансформация" },
            { n: 48, name: "Мастер" },
            { n: 100, name: "Легенда" }
        ];

        function initEvolution() {
            // Получаем данные из приложения (или ставим 0 по умолчанию)
            const saved = localStorage.getItem('resurs_body_sys');
            const state = saved ? JSON.parse(saved) : { sessions: 0 };
            const sessions = state.sessions || 0;
            
            // 1 тренировка дает примерно 2.5 дня "ресурсного" состояния организма
            const simulatedDays = Math.round(sessions * 2.5); 

            // Анимация главного счетчика
            animateValue("days-val", 0, simulatedDays, 1500);

            // Заполнение метрик
            document.getElementById('workout-count').innerText = sessions;
            document.getElementById('stress-save').innerText = Math.min(sessions * 5, 95) + '%';
            
            // Сэкономлено на врачах (1 тренировка = 3.5 часа экономии на походах по больницам в будущем)
            const hoursSaved = Math.round(sessions * 3.5);
            document.getElementById('doc-save').innerText = hoursSaved + ' ч.';

            // Уровень либидо (База + проценты)
            const libidoBoost = Math.min(sessions * 7, 150); // До +150%
            const libidoElement = document.getElementById('libido-level');
            if (libidoBoost === 0) {
                libidoElement.innerText = "База";
            } else if (libidoBoost > 50) {
                libidoElement.innerHTML = `+${libidoBoost}% 🔥`;
                libidoElement.classList.add('fire-text');
                libidoElement.classList.remove('accent-text');
            } else {
                libidoElement.innerText = `+${libidoBoost}%`;
                libidoElement.classList.add('accent-text');
            }

            // Логика прогресс-бара до следующего уровня
            let currentLevelIdx = levels.findIndex((l, i) => i < levels.length - 1 && sessions >= l.n && sessions < levels[i+1].n);
            if (currentLevelIdx === -1) currentLevelIdx = levels.length - 1; // Легенда
            
            const nextLevel = levels[currentLevelIdx + 1] || levels[levels.length - 1];
            const prevLevelThreshold = levels[currentLevelIdx].n;
            const target = nextLevel.n;
            
            if (sessions >= 100) {
                document.getElementById('next-goal-name').innerText = "Максимум";
                document.getElementById('next-goal-text').innerText = "Ты Легенда!";
                setTimeout(() => document.getElementById('goal-progress').style.width = '100%', 300);
            } else {
                document.getElementById('next-goal-name').innerText = nextLevel.name;
                const sessionsLeft = target - sessions;
                
                // Правильное склонение слова "занятие"
                let word = "занятий";
                if (sessionsLeft % 10 === 1 && sessionsLeft % 100 !== 11) word = "занятие";
                else if ([2,3,4].includes(sessionsLeft % 10) && ![12,13,14].includes(sessionsLeft % 100)) word = "занятия";
                
                document.getElementById('next-goal-text').innerText = `Еще ${sessionsLeft} ${word}`;
                
                const percent = Math.max(5, ((sessions - prevLevelThreshold) / (target - prevLevelThreshold)) * 100);
                setTimeout(() => document.getElementById('goal-progress').style.width = percent + '%', 500);
            }

            // Рендер таймлайна
            const container = document.getElementById('regen-container');
            container.innerHTML = milestones.map((m, index) => {
                // Если дней достаточно, этап активен. Первый этап всегда активен, если есть хоть 1 тренировка.
                const isActive = (simulatedDays >= m.day) || (sessions > 0 && index === 0);
                return `
                    <div class="regen-item ${isActive ? 'active' : ''}">
                        <div class="regen-icon">${m.icon}</div>
                        <div class="regen-info">
                            <span class="regen-day">День ${m.day}</span>
                            <h4>${m.title}</h4>
                            <p>${m.desc}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Плавная анимация цифр
        function animateValue(id, start, end, duration) {
            if (start === end) return;
            let obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        window.onload = initEvolution;
    </script>
</body>
</html>

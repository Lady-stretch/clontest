<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РЕСУРС | Панель управления</title>
    
    <link rel="icon" type="image/png" href="logo_header_final.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>
        // Инициализация темы при загрузке
        const savedTheme = localStorage.getItem('resurs_admin_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- ЦВЕТОВЫЕ ПЕРЕМЕННЫЕ СТУДИИ РЕСУРС --- */
        :root {
            /* СВЕТЛАЯ ТЕМА */
            --bg-deep: #F4F4F9; 
            --glass-bg: rgba(255, 255, 255, 0.85); 
            --glass-border: 1px solid rgba(0, 0, 0, 0.08); 
            --accent-gold: #B38639; 
            --text-main: #05050A; 
            --text-dim: rgba(8, 8, 20, 0.7);
            --elem-bg: rgba(0, 0, 0, 0.04);
            --elem-border: rgba(0, 0, 0, 0.1);
            --nav-bg: rgba(244, 244, 249, 0.95);
            
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-strict: 16px; 
            --danger-color: #DC2626;
            --edit-color: #0284C7;
        }

        [data-theme="dark"] {
            /* ТЕМНАЯ ТЕМА */
            --bg-deep: #080814; 
            --glass-bg: rgba(255, 255, 255, 0.02); 
            --glass-border: 1px solid rgba(255, 255, 255, 0.08); 
            --accent-gold: #C5A059; 
            --text-main: #F4F4F9;
            --text-dim: rgba(244, 244, 249, 0.6);
            --elem-bg: rgba(255, 255, 255, 0.05);
            --elem-border: rgba(255, 255, 255, 0.15);
            --nav-bg: rgba(8, 8, 20, 0.95);
            --edit-color: #38BDF8;
        }

        /* --- БАЗОВЫЕ СТИЛИ --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: var(--font-main);
            background: var(--bg-deep);
            color: var(--text-main);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            transition: background-color 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ШАПКА --- */
        .glass-header {
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: var(--glass-border);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 35px; border-radius: 8px; }
        .glass-header h1 {
            font-family: var(--font-serif); font-size: 20px;
            letter-spacing: 6px; text-transform: uppercase; color: var(--accent-gold); font-weight: 600; margin: 0;
        }

        /* --- КНОПКИ --- */
        .btn-lens {
            background: var(--elem-bg);
            backdrop-filter: blur(15px) saturate(160%);
            border: 1px solid var(--elem-border);
            border-radius: 8px; color: var(--text-main);
            padding: 8px 16px; font-size: 10px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            transition: var(--transition);
        }
        .btn-lens:hover { border-color: var(--accent-gold); transform: translateY(-2px); }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 16px 32px; border: 1px solid var(--accent-gold); color: var(--accent-gold);
            text-transform: uppercase; font-size: 11px; letter-spacing: 4px; font-weight: 600;
            background: transparent; cursor: pointer; transition: var(--transition); width: 100%; border-radius: 8px;
        }
        .btn-primary:hover { background: var(--accent-gold); color: #000; box-shadow: 0 0 30px rgba(197, 160, 89, 0.3); transform: translateY(-2px); }

        .button-cancel {
            background-color: transparent; color: var(--text-dim); border: 1px solid var(--elem-border);
            padding: 16px 32px; border-radius: 8px; cursor: pointer;
            font-size: 11px; font-weight: 600; width: 100%; margin-top: 15px;
            display: none; text-transform: uppercase; letter-spacing: 2px; transition: var(--transition);
        }
        .button-cancel:hover { border-color: var(--danger-color); color: var(--danger-color); }

        /* --- СЕТКА КАРТОЧЕК --- */
        .bento-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px;
            max-width: 1000px; margin: 50px auto; padding: 0 20px;
        }
        .bento-card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: var(--glass-border); border-radius: var(--radius-strict);
            padding: 30px; transition: var(--transition);
        }
        .bento-card:hover { border-color: rgba(197, 160, 89, 0.4); }
        .span-2 { grid-column: span 2; }

        /* --- ФОРМЫ И ИНПУТЫ --- */
        .form-group { display: flex; flex-direction: column; height: 100%; justify-content: center; gap: 10px; }
        
        label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 3px;
            color: var(--accent-gold); font-weight: 600; opacity: 0.9;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 15px 20px;
            border: 1px solid var(--elem-border); border-radius: 8px;
            font-family: var(--font-main); background-color: var(--elem-bg);
            color: var(--text-main); font-size: 15px; transition: var(--transition);
        }
        input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color: var(--accent-gold); background-color: transparent; }
        
        input[readonly] { opacity: 0.5; cursor: not-allowed; font-size: 13px;}

        input[type="file"] { display: none; }
        .file-upload-btn {
            background-color: var(--elem-bg); border: 1px dashed var(--accent-gold);
            color: var(--accent-gold); padding: 15px; text-align: center;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: var(--transition);
        }
        .file-upload-btn:hover { background-color: rgba(197, 160, 89, 0.1); }

        /* --- РЕДАКТОР QUILL (АДАПТАЦИЯ ПОД РЕСУРС) --- */
        #editor-container {
            height: 350px; background-color: var(--elem-bg); color: var(--text-main);
            font-family: var(--font-main); font-size: 16px; border: 1px solid var(--elem-border); border-top: none;
            border-radius: 0 0 8px 8px;
        }
        .ql-toolbar.ql-snow {
            background-color: var(--bg-deep); border: 1px solid var(--elem-border);
            border-radius: 8px 8px 0 0; font-family: var(--font-main);
        }
        .ql-container.ql-snow { border: none; }
        .ql-editor p { margin-bottom: 15px; line-height: 1.6; }
        
        /* Цвета кнопок редактора в темной теме */
        [data-theme="dark"] .ql-snow .ql-stroke { stroke: var(--text-dim); }
        [data-theme="dark"] .ql-snow .ql-fill { fill: var(--text-dim); }
        [data-theme="dark"] .ql-snow .ql-picker { color: var(--text-dim); }
        .ql-snow .ql-stroke { transition: stroke 0.3s; }
        .ql-snow .ql-picker-label:hover .ql-stroke, .ql-snow button:hover .ql-stroke { stroke: var(--accent-gold); }

        /* --- СПИСОК СТАТЕЙ --- */
        .article-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px;}
        .article-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background-color: var(--elem-bg);
            border: 1px solid var(--elem-border); border-radius: 12px; transition: var(--transition);
        }
        .article-item:hover { border-color: var(--accent-gold); }
        .article-title { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--text-main); margin-bottom: 5px;}
        .article-meta { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }

        .action-buttons { display: flex; gap: 10px; }
        
        .btn-edit, .btn-delete {
            background: transparent; border: 1px solid; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; transition: 0.3s;
        }
        .btn-edit { color: var(--edit-color); border-color: var(--edit-color); }
        .btn-edit:hover { background: rgba(2, 132, 199, 0.1); }
        .btn-delete { color: var(--danger-color); border-color: var(--danger-color); }
        .btn-delete:hover { background: rgba(220, 38, 38, 0.1); }

        /* --- СТАТУСЫ --- */
        #status {
            margin-top: 15px; padding: 15px; display: none; text-align: center;
            border-radius: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
        }
        .status-success { background: rgba(197, 160, 89, 0.1); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .status-error { background: rgba(220, 38, 38, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .status-loading { background: var(--elem-bg); color: var(--text-dim); border: 1px solid var(--elem-border); }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
            .span-2 { grid-column: span 1; }
            .article-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .action-buttons { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<header class="glass-header">
    <div class="logo-container">
        <img src="logo_header_final.png" alt="Логотип" class="logo-img">
        <h1>РЕСУРС</h1>
    </div>
    <button class="btn-lens" onclick="toggleTheme()" id="themeBtn">СВЕТ</button>
</header>

<main class="bento-grid">
    <div class="bento-card">
        <div class="form-group">
            <label>Заголовок статьи</label>
            <input type="text" id="title" placeholder="Например: Как снять боль в пояснице?">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Адрес страницы (slug)</label>
            <input type="text" id="slug" placeholder="kak-snyat-bol">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Текст материала (Можно вставлять из ИИ)</label>
            <div id="editor-container"></div>
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Обложка (Умное сжатие)</label>
            <label for="file-upload" class="file-upload-btn" id="upload-label">ФОТО НА КОМПЬЮТЕРЕ</label>
            <input type="file" id="file-upload" accept="image/*" onchange="handleFileSelect(event)">
            <input type="text" id="cover" placeholder="Ссылка на фото появится здесь..." readonly>
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Дата публикации (По умолчанию - сегодня)</label>
            <input type="date" id="pub-date">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Код видео (Rutube / YouTube iFrame)</label>
            <input type="text" id="rutube" placeholder='<iframe src="..." ...></iframe>'>
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <button class="btn-primary" id="btn-submit" onclick="sendData()">Опубликовать в Журнал</button>
            <button class="button-cancel" id="btn-cancel" onclick="cancelEdit()">Отменить редактирование</button>
            <div id="status"></div>
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label style="margin-bottom: 10px;">Управление архивом журнала</label>
            <button class="btn-lens" onclick="loadArticles()" style="width: fit-content;">Загрузить архив статей</button>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</main>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    // ВАЖНО: Замените на URL вашей новой функции Яндекс.Облака для "Ресурса", когда создадим её и подключим к ЯДБ
    const API_URL = 'https://functions.yandexcloud.net/YOUR_NEW_FUNCTION_URL';
    
    // Глобальные переменные для системы редактирования
    let currentEditId = null; 
    let loadedArticlesData = [];

    // Инициализация редактора
    var quill = new Quill('#editor-container', {
        theme: 'snow',
        placeholder: 'Напишите или вставьте текст...',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'header': [2, 3, false] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['clean']
            ]
        }
    });

    // Переключение темы (Свет/Тень)
    function toggleTheme() {
        const root = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (root.getAttribute('data-theme') === 'dark') {
            root.setAttribute('data-theme', 'light');
            btn.innerText = 'ТЕНЬ';
            localStorage.setItem('resurs_admin_theme', 'light');
        } else {
            root.setAttribute('data-theme', 'dark');
            btn.innerText = 'СВЕТ';
            localStorage.setItem('resurs_admin_theme', 'dark');
        }
    }
    
    // Установка текста кнопки при загрузке
    window.addEventListener('DOMContentLoaded', () => {
        const theme = document.documentElement.getAttribute('data-theme');
        document.getElementById('themeBtn').innerText = theme === 'dark' ? 'СВЕТ' : 'ТЕНЬ';
    });

    // Автоматическое сжатие фото перед отправкой
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const label = document.getElementById('upload-label');
        const coverInput = document.getElementById('cover');
        
        label.innerText = '⏳ ОБРАБОТКА...';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = async function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1200; 
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'upload',
                            filename: file.name.replace(/\s+/g, '-').toLowerCase(),
                            file_content: compressedBase64
                        })
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.status === 'success') {
                        label.innerText = '✅ ФОТО ЗАГРУЖЕНО';
                        coverInput.value = result.url; 
                    } else {
                        label.innerText = '❌ ОШИБКА';
                        alert('Ошибка сервера: ' + (result.error || result.message || 'Сбой на сервере'));
                    }
                } catch (error) {
                    label.innerText = '❌ СБОЙ СЕТИ';
                    alert('Сбой: Проверьте подключение к базе данных. ' + error.message);
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Сохранение / Обновление статьи
    async function sendData() {
        const statusDiv = document.getElementById('status');
        const richTextContent = quill.root.innerHTML;

        const data = {
            action: 'create', 
            id: currentEditId, // Передаем ID, если это редактирование
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: richTextContent, 
            cover_image_url: document.getElementById('cover').value, 
            rutube_iframe: document.getElementById('rutube').value,
            published_at: document.getElementById('pub-date').value,
            is_published: true
        };

        statusDiv.style.display = 'block';
        statusDiv.className = 'status-loading';
        statusDiv.innerText = 'Синхронизация с сервером...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                statusDiv.className = 'status-success';
                statusDiv.innerText = currentEditId ? 'Изменения успешно сохранены!' : 'Новый материал опубликован!';
                
                cancelEdit(); 
                loadArticles();
            } else {
                throw new Error(result.error || result.message || 'Ошибка сохранения');
            }
        } catch (error) {
            statusDiv.className = 'status-error';
            statusDiv.innerText = 'Системная ошибка: Функция еще не подключена к ЯДБ.';
        }
    }

    // Загрузка списка статей
    async function loadArticles() {
        const listDiv = document.getElementById('articleList');
        listDiv.innerHTML = '<p style="font-size: 13px; opacity: 0.7;">Загрузка данных...</p>';
        
        try {
            const response = await fetch(API_URL + '?action=list&admin=true', { method: 'GET' });
            const data = await response.json();
            
            if (data.articles && data.articles.length > 0) {
                loadedArticlesData = data.articles; 
                listDiv.innerHTML = '';
                
                data.articles.forEach(article => {
                    const textLength = article.content ? article.content.replace(/<[^>]+>/g, '').split(/\s+/).length : 0;
                    const readTime = Math.max(1, Math.ceil(textLength / 150));
                    const views = article.view_count || 0;
                    const dateStr = article.published_at || 'Нет даты';

                    listDiv.innerHTML += `
                        <div class="article-item" id="art-${article.id}">
                            <div>
                                <div class="article-title">${article.title}</div>
                                <div class="article-meta">
                                    ДАТА: ${dateStr} &nbsp;|&nbsp; ПРОСМОТРЫ: ${views} &nbsp;|&nbsp; ЧТЕНИЕ: ~${readTime} МИН
                                </div>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-edit" onclick="startEdit('${article.id}')">Редактировать</button>
                                <button class="btn-delete" onclick="deleteArticle('${article.id}')">Удалить</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                loadedArticlesData = [];
                listDiv.innerHTML = '<p style="font-size: 13px; opacity: 0.7;">Журнал пока пуст.</p>';
            }
        } catch (error) {
            listDiv.innerHTML = '<p style="font-size: 13px; color: var(--danger-color);">Сбой загрузки списка. Сервер еще не настроен.</p>';
        }
    }

    // Поднять данные статьи в редактор
    function startEdit(id) {
        const article = loadedArticlesData.find(a => a.id === id);
        if(!article) return;

        currentEditId = id;
        document.getElementById('title').value = article.title || '';
        document.getElementById('slug').value = article.slug || '';
        document.getElementById('cover').value = article.cover_image_url || '';
        document.getElementById('pub-date').value = article.published_at || '';
        document.getElementById('rutube').value = article.rutube_iframe || '';
        
        quill.root.innerHTML = article.content || '';

        document.getElementById('btn-submit').innerText = 'СОХРАНИТЬ ИЗМЕНЕНИЯ';
        document.getElementById('btn-cancel').style.display = 'block';
        document.getElementById('status').style.display = 'none';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Сбросить режим редактирования
    function cancelEdit() {
        currentEditId = null;
        document.getElementById('title').value = '';
        document.getElementById('slug').value = '';
        document.getElementById('cover').value = '';
        document.getElementById('pub-date').value = '';
        document.getElementById('rutube').value = '';
        quill.setContents([]); 
        
        document.getElementById('upload-label').innerText = 'ФОТО НА КОМПЬЮТЕРЕ';
        document.getElementById('btn-submit').innerText = 'ОПУБЛИКОВАТЬ В ЖУРНАЛ';
        document.getElementById('btn-cancel').style.display = 'none';
    }

    // Удаление статьи
    async function deleteArticle(id) {
        if(!confirm('Точно удалить эту статью? Действие необратимо.')) return;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                document.getElementById(`art-${id}`).remove();
                if(currentEditId === id) cancelEdit(); 
            } else {
                alert('Ошибка: ' + (result.error || result.message));
            }
        } catch (error) {
            alert('Ошибка удаления. Проверьте подключение базы данных ЯДБ.');
        }
    }
</script>

</body>
</html>

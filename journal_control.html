<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>РЕСУРС | Панель управления</title>
    
    <link rel="icon" type="image/png" href="logo_header_final.png">
    <link rel="apple-touch-icon" href="logo_header_final.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>
        // Инициализация темы при загрузке без мерцания
        const savedTheme = localStorage.getItem('resurs_admin_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        :root {
            --bg-color: #0A090F;
            --surface-color: #12101B;
            --surface-hover: #1A1727;
            --accent-color: #6C3EB8;
            --accent-hover: #8352D6;
            --accent-subtle: rgba(108, 62, 184, 0.15);
            --text-main: #F5F4F9;
            --text-muted: #9693A6;
            --border-color: rgba(108, 62, 184, 0.22);
            --header-bg: rgba(10, 9, 15, 0.88);
            --shadow: rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --danger-color: #EF4444;
            --edit-color: #38BDF8;
        }

        [data-theme="light"] {
            --bg-color: #F8F7FC;
            --surface-color: #FFFFFF;
            --surface-hover: #F1EDF9;
            --accent-color: #5B3494;
            --accent-hover: #48257B;
            --accent-subtle: rgba(91, 52, 148, 0.08);
            --text-main: #14121E;
            --text-muted: #666375;
            --border-color: rgba(91, 52, 148, 0.16);
            --header-bg: rgba(248, 247, 252, 0.9);
            --shadow: rgba(0, 0, 0, 0.05);
            --edit-color: #0284C7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        
        html, body {
            overflow-x: hidden !important;
            max-width: 100%;
            width: 100%;
            position: relative;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Manrope', sans-serif; 
            line-height: 1.6;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            transition: background-color 0.3s ease, color 0.3s ease; 
            -webkit-font-smoothing: antialiased; 
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.5px; }

        /* ШАПКА */
        .glass-header {
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%;
            background: var(--header-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 34px; width: 34px; border-radius: 6px; }
        .glass-header h1 {
            font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-main); font-weight: 800; margin: 0;
        }
        .glass-header h1 span { color: var(--accent-color); }

        /* КНОПКИ */
        .btn-lens {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-main);
            padding: 8px 16px; font-size: 10px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            transition: var(--transition);
        }
        .btn-lens:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 15px 30px; border: 1px solid var(--accent-color); color: #FFF;
            text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 800;
            background: var(--accent-color); cursor: pointer; transition: var(--transition); width: 100%; border-radius: 8px;
        }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: 0 10px 25px rgba(108, 62, 184, 0.4); transform: translateY(-1px); }

        .button-cancel {
            background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 15px 30px; border-radius: 8px; cursor: pointer;
            font-size: 11px; font-weight: 800; width: 100%; margin-top: 12px;
            display: none; text-transform: uppercase; letter-spacing: 1px; transition: var(--transition);
        }
        .button-cancel:hover { border-color: var(--danger-color); color: var(--danger-color); }

        /* СЕТКА BENTO */
        .bento-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
            max-width: 1000px; margin: 40px auto; padding: 0 20px;
        }
        .bento-card {
            background: var(--surface-color); backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); border-radius: 14px;
            padding: 28px; transition: var(--transition); box-shadow: 0 10px 30px var(--shadow);
        }
        .bento-card:hover { border-color: var(--accent-color); }
        .span-2 { grid-column: span 2; }

        /* ФОРМЫ */
        .form-group { display: flex; flex-direction: column; height: 100%; justify-content: center; gap: 8px; }
        
        label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent-color); font-weight: 800;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 14px 18px;
            border: 1px solid var(--border-color); border-radius: 8px;
            font-family: inherit; background-color: var(--bg-color);
            color: var(--text-main); font-size: 14px; transition: var(--transition);
        }
        input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color: var(--accent-color); }
        
        input[readonly] { opacity: 0.6; cursor: not-allowed; font-size: 12px; }

        input[type="file"] { display: none; }
        .file-upload-btn {
            background-color: var(--bg-color); border: 1px dashed var(--accent-color);
            color: var(--accent-color); padding: 14px; text-align: center;
            border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; transition: var(--transition);
        }
        .file-upload-btn:hover { background-color: var(--accent-subtle); }

        /* РЕДАКТОР QUILL */
        #editor-container {
            height: 340px; background-color: var(--bg-color); color: var(--text-main);
            font-family: inherit; font-size: 15px; border: 1px solid var(--border-color); border-top: none;
            border-radius: 0 0 8px 8px;
        }
        .ql-toolbar.ql-snow {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 8px 8px 0 0; font-family: inherit;
        }
        .ql-container.ql-snow { border: none; }
        .ql-editor p { margin-bottom: 14px; line-height: 1.6; }
        
        [data-theme="dark"] .ql-snow .ql-stroke { stroke: var(--text-muted); }
        [data-theme="dark"] .ql-snow .ql-fill { fill: var(--text-muted); }
        [data-theme="dark"] .ql-snow .ql-picker { color: var(--text-muted); }
        .ql-snow .ql-stroke { transition: stroke 0.3s; }
        .ql-snow .ql-picker-label:hover .ql-stroke, .ql-snow button:hover .ql-stroke { stroke: var(--accent-color); }

        .ql-editor.ql-blank::before {
            color: var(--text-muted) !important; font-style: normal !important; opacity: 0.6;
        }

        /* СПИСОК СТАТЕЙ */
        .article-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .article-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 20px; background-color: var(--bg-color);
            border: 1px solid var(--border-color); border-radius: 10px; transition: var(--transition);
        }
        .article-item:hover { border-color: var(--accent-color); }
        .article-title { font-weight: 700; font-size: 17px; color: var(--text-main); margin-bottom: 4px; }
        .article-meta { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }

        .action-buttons { display: flex; gap: 8px; }
        
        .btn-edit, .btn-delete {
            background: transparent; border: 1px solid; padding: 7px 14px;
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 800; text-transform: uppercase; transition: var(--transition);
        }
        .btn-edit { color: var(--edit-color); border-color: var(--edit-color); }
        .btn-edit:hover { background: rgba(56, 189, 248, 0.1); }
        .btn-delete { color: var(--danger-color); border-color: var(--danger-color); }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.1); }

        /* СТАТУСЫ */
        #status {
            margin-top: 15px; padding: 14px; display: none; text-align: center;
            border-radius: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;
        }
        .status-success { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid #10B981; }
        .status-error { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .status-loading { background: var(--bg-color); color: var(--text-muted); border: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
            .span-2 { grid-column: span 1; }
            .article-item { flex-direction: column; align-items: flex-start; gap: 14px; }
            .action-buttons { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<header class="glass-header">
    <div class="logo-container">
        <img src="logo_header_final.png" alt="Логотип РЕСУРС" class="logo-img">
        <h1>РЕСУРС<span>.АДМИН</span></h1>
    </div>
    <button class="btn-lens" onclick="toggleThemeInstant()" id="themeBtn">ТЕМА: ТЕМНАЯ</button>
</header>

<main class="bento-grid">
    <div class="bento-card">
        <div class="form-group">
            <label>Заголовок статьи</label>
            <input type="text" id="title" placeholder="Например: Как снять боль в пояснице?">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Адрес страницы (slug)</label>
            <input type="text" id="slug" placeholder="kak-snyat-bol">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Текст материала (Визуальный редактор)</label>
            <div id="editor-container"></div>
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Обложка (Умное сжатие)</label>
            <label for="file-upload" class="file-upload-btn" id="upload-label">ЗАГРУЗИТЬ ФОТО</label>
            <input type="file" id="file-upload" accept="image/*" onchange="handleFileSelect(event)">
            <input type="text" id="cover" placeholder="Ссылка на обложку..." readonly style="margin-top: 8px;">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Дата публикации (По умолчанию - сегодня)</label>
            <input type="date" id="pub-date">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Код видео (Rutube / YouTube iFrame)</label>
            <input type="text" id="rutube" placeholder='<iframe src="..." ...></iframe>'>
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <button class="btn-primary" id="btn-submit" onclick="sendData()">Опубликовать в Журнал</button>
            <button class="button-cancel" id="btn-cancel" onclick="cancelEdit()">Отменить редактирование</button>
            <div id="status"></div>
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label style="margin-bottom: 10px;">Архив и управление материалами</label>
            <button class="btn-lens" onclick="loadArticles()" style="width: fit-content;">Загрузить архив статей</button>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</main>

<!-- Quill.js JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    const API_URL = 'https://functions.yandexcloud.net/d4eqj03a2p0lq05nm4k4';
    
    let currentEditId = null; 
    let loadedArticlesData = [];

    // Инициализация редактора Quill
    var quill = new Quill('#editor-container', {
        theme: 'snow',
        placeholder: 'Напишите или вставьте текст статьи...',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'header': [2, 3, false] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['clean']
            ]
        }
    });

    // Мгновенное переключение темы
    function toggleThemeInstant() {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        
        root.setAttribute('data-theme', next);
        localStorage.setItem('resurs_admin_theme', next);
        updateThemeBtnText(next);
    }

    function updateThemeBtnText(theme) {
        const btn = document.getElementById('themeBtn');
        if (btn) btn.innerText = theme === 'dark' ? 'ТЕМА: ТЕМНАЯ' : 'ТЕМА: СВЕТЛАЯ';
    }

    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('resurs_admin_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeBtnText(saved);
        
        // Устанавливаем сегодняшнюю дату по умолчанию
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('pub-date');
        if (dateInput && !dateInput.value) dateInput.value = today;
    });

    // Умное сжатие фото перед отправкой
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const label = document.getElementById('upload-label');
        const coverInput = document.getElementById('cover');
        
        label.innerText = '⏳ ОБРАБОТКА И СЖАТИЕ...';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = async function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1200; 
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'upload',
                            filename: file.name.replace(/\s+/g, '-').toLowerCase(),
                            file_content: compressedBase64
                        })
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.status === 'success') {
                        label.innerText = '✅ ФОТО ЗАГРУЖЕНО';
                        coverInput.value = result.url; 
                    } else {
                        label.innerText = '❌ ОШИБКА ЗАГРУЗКИ';
                        alert('Ошибка сервера: ' + (result.error || result.message || 'Сбой на сервере'));
                    }
                } catch (error) {
                    label.innerText = '❌ СБОЙ СЕТИ';
                    alert('Сбой: Проверьте подключение к облаку. ' + error.message);
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Сохранение / Обновление статьи
    async function sendData() {
        const statusDiv = document.getElementById('status');
        const richTextContent = quill.root.innerHTML;

        const data = {
            action: 'create', 
            id: currentEditId,
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: richTextContent, 
            cover_image_url: document.getElementById('cover').value, 
            rutube_iframe: document.getElementById('rutube').value,
            published_at: document.getElementById('pub-date').value,
            is_published: true
        };

        statusDiv.style.display = 'block';
        statusDiv.className = 'status-loading';
        statusDiv.innerText = 'Синхронизация с сервером YDB...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                statusDiv.className = 'status-success';
                statusDiv.innerText = currentEditId ? 'Изменения успешно сохранены!' : 'Новый материал опубликован!';
                
                cancelEdit(); 
                loadArticles();
            } else {
                throw new Error(result.error || result.message || 'Ошибка сохранения');
            }
        } catch (error) {
            statusDiv.className = 'status-error';
            statusDiv.innerText = 'Системная ошибка: ' + error.message;
        }
    }

    // Загрузка списка статей
    async function loadArticles() {
        const listDiv = document.getElementById('articleList');
        listDiv.innerHTML = '<p style="font-size: 13px; opacity: 0.7;">Загрузка архива из базы...</p>';
        
        try {
            const response = await fetch(API_URL + '?action=list&admin=true', { method: 'GET' });
            const data = await response.json();
            
            if (data.articles && data.articles.length > 0) {
                loadedArticlesData = data.articles; 
                listDiv.innerHTML = '';
                
                data.articles.forEach(article => {
                    const textLength = article.content ? article.content.replace(/<[^>]+>/g, '').split(/\s+/).length : 0;
                    const readTime = Math.max(1, Math.ceil(textLength / 150));
                    const views = article.view_count || 0;
                    const dateStr = article.published_at || 'Нет даты';

                    listDiv.innerHTML += `
                        <div class="article-item" id="art-${article.id}">
                            <div>
                                <div class="article-title">${article.title}</div>
                                <div class="article-meta">
                                    ДАТА: ${dateStr} &nbsp;|&nbsp; ПРОСМОТРЫ: ${views} &nbsp;|&nbsp; ЧТЕНИЕ: ~${readTime} МИН
                                </div>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-edit" onclick="startEdit('${article.id}')">Редактировать</button>
                                <button class="btn-delete" onclick="deleteArticle('${article.id}')">Удалить</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                loadedArticlesData = [];
                listDiv.innerHTML = '<p style="font-size: 13px; opacity: 0.7;">Журнал пока пуст.</p>';
            }
        } catch (error) {
            listDiv.innerHTML = '<p style="font-size: 13px; color: var(--danger-color);">Сбой загрузки архива.</p>';
        }
    }

    // Поднять данные статьи в редактор
    function startEdit(id) {
        const article = loadedArticlesData.find(a => a.id === id);
        if(!article) return;

        currentEditId = id;
        document.getElementById('title').value = article.title || '';
        document.getElementById('slug').value = article.slug || '';
        document.getElementById('cover').value = article.cover_image_url || '';
        document.getElementById('pub-date').value = article.published_at || '';
        document.getElementById('rutube').value = article.rutube_iframe || '';
        
        quill.root.innerHTML = article.content || '';

        document.getElementById('btn-submit').innerText = 'СОХРАНИТЬ ИЗМЕНЕНИЯ';
        document.getElementById('btn-cancel').style.display = 'block';
        document.getElementById('status').style.display = 'none';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Сбросить режим редактирования
    function cancelEdit() {
        currentEditId = null;
        document.getElementById('title').value = '';
        document.getElementById('slug').value = '';
        document.getElementById('cover').value = '';
        document.getElementById('rutube').value = '';
        quill.setContents([]); 
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pub-date').value = today;

        document.getElementById('upload-label').innerText = 'ЗАГРУЗИТЬ ФОТО';
        document.getElementById('btn-submit').innerText = 'ОПУБЛИКОВАТЬ В ЖУРНАЛ';
        document.getElementById('btn-cancel').style.display = 'none';
    }

    // Удаление статьи
    async function deleteArticle(id) {
        if(!confirm('Точно удалить эту статью из базы данных? Действие необратимо.')) return;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                document.getElementById(`art-${id}`).remove();
                if(currentEditId === id) cancelEdit(); 
            } else {
                alert('Ошибка: ' + (result.error || result.message));
            }
        } catch (error) {
            alert('Ошибка удаления. Проверьте соединение.');
        }
    }
</script>

</body>
</html>
